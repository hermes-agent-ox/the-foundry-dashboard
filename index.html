function init() {
  document.getElementById('gen-date').textContent = DATA.generated;

  // Summary bar
  const sb = document.getElementById('summary-bar');
  let total = 0;
  for (const [k,v] of Object.entries(DATA.stages)) {
    total += v.count;
  }
  const stageColors = {
    Capture:'#58a6ff', Incubate:'#3fb950', Challenge:'#d29922',
    Organize:'#bc8cff', Draft:'#f778ba', Polish:'#39d2c0', Archive:'#8b949e'
  };
  let html = `<span class="sum-item"><span class="dot" style="background:#8b949e"></span>${total} total files</span>`;
  for (const [k,v] of Object.entries(DATA.stages)) {
    html += `<span class="sum-item"><span class="dot" style="background:${stageColors[k]||'#8b949e'}"></span>${v.label} (${v.count})</span>`;
  }
  html += `<span class="sum-item">✦ ${DATA.templates.length} templates</span>`;
  sb.innerHTML = html;

  // Pipeline flow
  const pf = document.getElementById('pipeline-flow');
  const stageOrder = ['Capture','Incubate','Challenge','Organize','Draft','Polish','Archive'];
  const stageLabels = {Capture:'Inbox',Incubate:'Incubating',Challenge:'Challenged',Organize:'Queue',Draft:'Drafts',Polish:'Polished',Archive:'Cold Storage'};
  const stageIcons = {Capture:'📥',Incubate:'🔄',Challenge:'⚔️',Organize:'📋',Draft:'✍️',Polish:'✨',Archive:'🗄️'};
  
  // Determine bottleneck: empty mid-pipeline stages (Capture→Incubate→Challenge→Organize→Draft→Polish)
  const midStages = ['Incubate','Challenge','Organize','Draft','Polish'];
  const bottleneckStages = midStages.filter(s => DATA.stages[s].count === 0);
  
  let flowHtml = '';
  stageOrder.forEach((s, i) => {
    const st = DATA.stages[s];
    const isBottleneck = bottleneckStages.includes(s);
    const isActive = st.count > 0;
    const cls = 'stage-card' + (isBottleneck ? ' bottleneck' : '') + (isActive ? ' active' : '');
    flowHtml += `<div class="${cls}" data-stage="${s}" onclick="togglePanel('${s}')">
      <div class="stage-label">${stageIcons[s]} ${st.label}</div>
      <div class="stage-name">${s}</div>
      <div class="stage-count ${st.count===0?'empty':''}">${st.count}</div>
    </div>`;
    if (i < stageOrder.length - 1) {
      flowHtml += '<div class="pipeline-arrow">›</div>';
    }
  });
  pf.innerHTML = flowHtml;

  // Detail panels
  const dp = document.getElementById('detail-panels');
  let panelsHtml = '';
  stageOrder.forEach(s => {
    const st = DATA.stages[s];
    const label = stageLabels[s];
    panelsHtml += `<div class="detail-panel" id="panel-${s}">
      <div class="detail-panel-header" onclick="togglePanel('${s}')">
        <div>
          <div class="dp-label">${stageIcons[s]} ${label}</div>
          <div class="dp-title">${s} Stage</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="dp-count">${st.count} file${st.count!==1?'s':''}</div>
          <div class="dp-toggle" id="toggle-${s}">▼</div>
        </div>
      </div>
      <div class="detail-panel-body" id="body-${s}">
        ${st.count === 0 ? '<div class="empty-state">No files in this stage</div>' : buildFileList(st.files)}
      </div>
    </div>`;
  });
  dp.innerHTML = panelsHtml;

  // Templates section
  if (DATA.templates.length > 0) {
    const ts = document.getElementById('templates-section');
    let tHtml = '<h2>Templates <span>— ' + DATA.templates.length + ' vault templates</span></h2><div class="templates-grid">';
    DATA.templates.forEach(t => {
      const label = t.stage_label || t.rel_path.split('/')[0] || 'Vault';
      tHtml += `<a href="${t.rel_path}" class="template-card" target="_blank">
        <div class="tpl-label">📄 ${label}</div>
        <div class="tpl-name">${t.title || t.filename}</div>
      </a>`;
    });
    tHtml += '</div>';
    ts.innerHTML = tHtml;
  }
}

function buildFileList(files) {
  let html = '<div class="file-list">';
  files.forEach((f, idx) => {
    const tags = (f.tags || []).map(t => {
      const clean = String(t).replace(/^#/,'');
      return `<span class="tag tag-${clean}">#${clean}</span>`;
    }).join(' ');
    const rating = f.rating ? `<span class="fc-rating">★ ${f.rating}</span>` : '';
    const dateStr = f.date || '';
    const angleSnippet = f.suggested_angle ? f.suggested_angle.slice(0,80) + (f.suggested_angle.length > 80 ? '...' : '') : '';
    html += `<div class="file-card">
      <div class="file-card-summary" onclick="toggleDetail('${idx}')">
        <div class="fc-top">
          <span class="fc-filename">📄 ${f.filename}</span>
        </div>
        <div class="fc-meta">
          ${dateStr ? `<span class="fc-date">📅 ${dateStr}</span>` : ''}
          ${rating}
          ${tags}
          ${angleSnippet ? `<span style="color:var(--text2);font-style:italic">"${angleSnippet}"</span>` : ''}
        </div>
      </div>
      <div class="file-card-detail" id="detail-${idx}">
        ${f.source ? `<div class="detail-label">Source</div><div class="detail-value"><a href="${f.source}" target="_blank">${f.source}</a></div>` : ''}
        ${f.suggested_angle ? `<div class="detail-label">Suggested Angle</div><div class="detail-value">${f.suggested_angle}</div>` : ''}
        ${f.challenge_date ? `<div class="detail-label">Challenge Date</div><div class="detail-value">${f.challenge_date}</div>` : ''}
        ${f.gauntlet_score ? `<div class="detail-label">Gauntlet Score</div><div class="detail-value">${f.gauntlet_score}</div>` : ''}
        ${f.content_type ? `<div class="detail-label">Content Type</div><div class="detail-value">${f.content_type}</div>` : ''}
        ${f.preview ? `<div class="detail-label">Body Preview</div><div class="detail-value">${f.preview}</div>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

// Track which panels are open
const openPanels = new Set();
const openDetails = new Set();

function togglePanel(stage) {
  const body = document.getElementById('body-' + stage);
  const toggle = document.getElementById('toggle-' + stage);
  if (openPanels.has(stage)) {
    openPanels.delete(stage);
    body.classList.remove('open');
    toggle.classList.remove('open');
  } else {
    openPanels.add(stage);
    body.classList.add('open');
    toggle.classList.add('open');
  }
}

function toggleDetail(idx) {
  const el = document.getElementById('detail-' + idx);
  if (openDetails.has(idx)) {
    openDetails.delete(idx);
    el.classList.remove('open');
  } else {
    openDetails.add(idx);
    el.classList.add('open');
  }
}

init();
</script>
