/* Rating stars */
.rating { color:#d29922; font-size:12px; }
/* Templates section */

/* Source URL truncation */

/* Empty state */

/* Animations */

// ── Pipeline Config ────────────────────────────────────────────────
const STAGE_CONFIG = [
  {id:'Capture',    icon:'📥',  label:'Capture',     desc:'Raw incoming ideas'},
  {id:'Incubate',   icon:'🥚',  label:'Incubate',    desc:'Brewing & refinement'},
  {id:'Challenge',  icon:'⚔️',  label:'Challenge',   desc:'Gauntlet testing'},
  {id:'Organize',   icon:'📋',  label:'Organize',    desc:'Queue & backlog'},
  {id:'Draft',      icon:'✍️',  label:'Draft',       desc:'Content being written'},
  {id:'Polish',     icon:'✨',  label:'Polish',      desc:'Final formatting'},
  {id:'Archive',    icon:'🗄️',  label:'Archive',     desc:'Cold storage'},
];

// ── Render ─────────────────────────────────────────────────────────
function isMidPipeline(id) {
  return ['Incubate','Challenge','Organize','Draft','Polish'].includes(id);
}

function renderBar() {
  const bar = document.getElementById('pipeline-bar');
  bar.innerHTML = '';
  STAGE_CONFIG.forEach(cfg => {
    const count = DATA.pipeline_counts[cfg.id] || 0;
    const card = document.createElement('div');
    card.className = 'stage-card';
    card.onclick = () => togglePanel(cfg.id);
    
    if (count === 0 && isMidPipeline(cfg.id)) {
      const badge = document.createElement('div');
      badge.className = 'bottleneck';
      badge.textContent = '⚠ BOTTLENECK';
      card.appendChild(badge);
    }
    
    const iconDiv = document.createElement('div');
    iconDiv.className = 'stage-icon';
    iconDiv.textContent = cfg.icon;
    
    const h3 = document.createElement('h3');
    h3.textContent = cfg.label;
    
    const countDiv = document.createElement('div');
    countDiv.className = 'count';
    countDiv.textContent = count;
    
    card.appendChild(iconDiv);
    card.appendChild(h3);
    card.appendChild(countDiv);
    bar.appendChild(card);
  });
}

function togglePanel(id) {
  const panel = document.getElementById('panel-' + id);
  if (!panel) return;
  const header = panel.querySelector('.panel-header');
  const body = panel.querySelector('.panel-body');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  header.classList.toggle('open');
  // Highlight stage card
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
  if (!isOpen) {
    const cards = document.querySelectorAll('.stage-card');
    const idx = STAGE_CONFIG.findIndex(c => c.id === id);
    if (cards[idx]) cards[idx].classList.add('active');
  }
}

function formatDate(d) {
  if (!d || d === 'None' || d === '') return '—';
  return d;
}

function formatTags(tags) {
  if (!tags || tags.length === 0) return '';
  return tags.map(t => {
    const cls = 'tag-' + t.toLowerCase().replace(/[^a-z0-9]/g, '');
    return `<span class="tag tag-default ${cls}">#${t}</span>`;
  }).join('');
}

function formatRating(r) {
  if (r === null || r === undefined || r === '') return '';
  const n = parseInt(r);
  if (isNaN(n)) return '';
  return '★'.repeat(n) + '☆'.repeat(5-n);
}

function renderFileEntry(entry, isTemplate) {
  const div = document.createElement('div');
  div.className = 'file-card';
  
  const nameLine = document.createElement('div');
  nameLine.className = 'file-name';
  nameLine.textContent = entry.filename;
  
  const meta = document.createElement('div');
  meta.className = 'file-meta';
  
  const dateSpan = document.createElement('span');
  dateSpan.textContent = '📅 ' + formatDate(entry.date);
  
  const ratingSpan = document.createElement('span');
  const r = formatRating(entry.rating);
  if (r) {
    ratingSpan.innerHTML = '⭐ ' + r;
  }
  
  const gauntletSpan = document.createElement('span');
  if (entry.gauntlet_score && entry.gauntlet_score !== 'None' && entry.gauntlet_score !== '') {
    gauntletSpan.textContent = '🏆 ' + entry.gauntlet_score;
  }
  
  const tagSpan = document.createElement('span');
  tagSpan.innerHTML = formatTags(entry.tags);
  
  meta.appendChild(dateSpan);
  meta.appendChild(ratingSpan);
  meta.appendChild(gauntletSpan);
  meta.appendChild(tagSpan);
  
  div.appendChild(nameLine);
  div.appendChild(meta);
  
  // Detail section (hidden)
  const detail = document.createElement('div');
  detail.className = 'file-detail';
  
  if (entry.source_url) {
    const srcLabel = document.createElement('div');
    srcLabel.className = 'detail-label';
    srcLabel.textContent = 'Source URL';
    const srcVal = document.createElement('div');
    srcVal.className = 'detail-value';
    srcVal.innerHTML = `<a href="${entry.source_url}" target="_blank" class="source-url" title="${entry.source_url}">${entry.source_url}</a>`;
    detail.appendChild(srcLabel);
    detail.appendChild(srcVal);
  }
  
  if (entry.suggested_angle) {
    const angLabel = document.createElement('div');
    angLabel.className = 'detail-label';
    angLabel.textContent = 'Suggested Angle';
    const angVal = document.createElement('div');
    angVal.className = 'detail-value';
    angVal.textContent = entry.suggested_angle;
    detail.appendChild(angLabel);
    detail.appendChild(angVal);
  }
  
  if (entry.challenge_date && entry.challenge_date !== 'None' && entry.challenge_date !== '') {
    const cdLabel = document.createElement('div');
    cdLabel.className = 'detail-label';
    cdLabel.textContent = 'Challenge Date';
    const cdVal = document.createElement('div');
    cdVal.className = 'detail-value';
    cdVal.textContent = entry.challenge_date;
    detail.appendChild(cdLabel);
    detail.appendChild(cdVal);
  }
  
  if (entry.body_preview) {
    const bpLabel = document.createElement('div');
    bpLabel.className = 'detail-label';
    bpLabel.textContent = 'Body Preview';
    const bpVal = document.createElement('div');
    bpVal.className = 'body-preview';
    bpVal.textContent = entry.body_preview;
    detail.appendChild(bpLabel);
    detail.appendChild(bpVal);
  }
  
  div.appendChild(detail);
  
  // Click to expand
  div.addEventListener('click', (e) => {
    // Don't toggle if clicking a link
    if (e.target.tagName === 'A') return;
    detail.classList.toggle('open');
  });
  
  return div;
}

function renderPanels() {
  const container = document.getElementById('stage-panels');
  container.innerHTML = '';
  
  STAGE_CONFIG.forEach(cfg => {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + cfg.id;
    
    const header = document.createElement('div');
    header.className = 'panel-header';
    header.onclick = () => togglePanel(cfg.id);
    
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '▶';
    
    const title = document.createElement('span');
    title.className = 'panel-title';
    title.textContent = cfg.icon + ' ' + cfg.label + ' (' + cfg.desc + ')';
    
    const countBadge = document.createElement('span');
    countBadge.className = 'panel-count';
    countBadge.textContent = (DATA.pipeline_counts[cfg.id] || 0) + ' files';
    
    header.appendChild(arrow);
    header.appendChild(title);
    header.appendChild(countBadge);
    
    const body = document.createElement('div');
    body.className = 'panel-body';
    
    const entries = DATA.pipeline_data[cfg.id] || [];
    if (entries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No files in this stage.';
      body.appendChild(empty);
    } else {
      entries.forEach(entry => {
        body.appendChild(renderFileEntry(entry, false));
      });
    }
    
    panel.appendChild(header);
    panel.appendChild(body);
    container.appendChild(panel);
  });
}

function renderTemplates() {
  const section = document.getElementById('templates-section');
  const tpl = DATA.templates || [];
  if (tpl.length === 0) return;
  
  const panel = document.createElement('div');
  panel.className = 'panel open';
  panel.id = 'panel-templates';
  
  const header = document.createElement('div');
  header.className = 'panel-header open';
  
  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  arrow.textContent = '▼';
  
  const title = document.createElement('span');
  title.className = 'panel-title';
  title.textContent = '📄 Templates (' + tpl.length + ')';
  
  header.appendChild(arrow);
  header.appendChild(title);
  
  const body = document.createElement('div');
  body.className = 'panel-body open';
  
  tpl.forEach(entry => {
    body.appendChild(renderFileEntry(entry, true));
  });
  
  panel.appendChild(header);
  panel.appendChild(body);
  
  // Make collapsible
  header.onclick = () => {
    body.classList.toggle('open');
    header.classList.toggle('open');
    arrow.textContent = body.classList.contains('open') ? '▼' : '▶';
  };
  
  section.appendChild(panel);
}

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderBar();
  renderPanels();
  renderTemplates();
});
</script>
</body>
</html>
