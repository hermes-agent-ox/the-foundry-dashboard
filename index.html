<!DOCTYPE html>

<title>Foundry Content Pipeline Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0d1117;color:#e6edf3;padding:24px;min-height:100vh}
h1{font-size:1.6rem;font-weight:600;margin-bottom:4px;color:#f0f6fc}
.subtitle{color:#8b949e;font-size:.9rem;margin-bottom:24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header-left h1{margin-bottom:2px}
.timestamp{font-size:.8rem;color:#8b949e}

/* Pipeline Flow */
.pipeline{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:28px}
@media(max-width:900px){.pipeline{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.pipeline{grid-template-columns:repeat(2,1fr)}}
.stage-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;cursor:pointer;transition:all .15s ease;position:relative;overflow:hidden}
.stage-card:hover{background:#1c2128;border-color:#58a6ff;transform:translateY(-2px)}
.stage-card.active{border-color:#58a6ff;background:#1c2128}
.stage-card .stage-name{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#8b949e;margin-bottom:4px}
.stage-card .stage-count{font-size:1.8rem;font-weight:700;color:#f0f6fc;line-height:1.2}
.stage-card .stage-label{font-size:.7rem;color:#8b949e;margin-top:2px}
.stage-card .stage-bar{position:absolute;bottom:0;left:0;height:3px;background:#58a6ff;transition:width .3s ease}
.stage-card.empty{opacity:.5}
.stage-card.empty .stage-bar{background:#30363d}

/* Summary stats */
.stats-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.stat-box .stat-icon{font-size:1.2rem}
.stat-box .stat-label{font-size:.75rem;color:#8b949e}
.stat-box .stat-value{font-size:1.1rem;font-weight:600;color:#f0f6fc}

/* Stage detail panel */
.detail-panel{background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:24px;display:none;overflow:hidden}
.detail-panel.open{display:block}
.detail-panel-header{padding:14px 16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.detail-panel-header h3{font-size:.95rem;font-weight:600;color:#f0f6fc}
.detail-panel-header .close-btn{background:none;border:none;color:#8b949e;font-size:1.2rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.detail-panel-header .close-btn:hover{color:#f0f6fc;background:#30363d}
.detail-panel-body{padding:12px 16px}
.detail-panel-body .empty-msg{color:#8b949e;font-style:italic;padding:16px 0;text-align:center}

/* File cards */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.file-card{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px 12px;cursor:pointer;transition:all .1s ease}
.file-card:hover{border-color:#58a6ff;background:#111820}
.file-card .file-name{font-size:.82rem;font-weight:600;color:#e6edf3;margin-bottom:2px;word-break:break-all}
.file-card .file-path{font-size:.7rem;color:#8b949e;margin-bottom:4px;word-break:break-all}
.file-card .file-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.file-card .file-tag{font-size:.65rem;background:#1f2937;color:#58a6ff;padding:1px 6px;border-radius:3px}
.file-card .file-meta{font-size:.7rem;color:#8b949e;display:flex;gap:10px;margin-top:3px;flex-wrap:wrap}
.file-card .file-angle{font-size:.72rem;color:#d2d8e0;margin-top:4px;line-height:1.35}
.file-card .file-frontmatter{display:none;margin-top:6px;padding-top:6px;border-top:1px solid #21262d;font-size:.72rem;color:#8b949e;overflow-x:auto}
.file-card .file-frontmatter.open{display:block}
.file-card .file-frontmatter table{width:100%;border-collapse:collapse}
.file-card .file-frontmatter td{padding:2px 4px;vertical-align:top}
.file-card .file-frontmatter td:first-child{color:#58a6ff;white-space:nowrap;padding-right:8px;font-weight:500}
.file-card .file-frontmatter td:last-child{color:#e6edf3;word-break:break-all}

/* Templates section */
.templates-section{margin-top:28px}
.templates-section h2{font-size:1.1rem;font-weight:600;color:#f0f6fc;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #30363d}
.templates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.template-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px 12px}
.template-card .tpl-name{font-size:.8rem;font-weight:600;color:#d2d8e0}
.template-card .tpl-path{font-size:.7rem;color:#8b949e;margin-top:2px}

/* Footer */
.footer{margin-top:32px;padding-top:12px;border-top:1px solid #21262d;font-size:.75rem;color:#8b949e;text-align:center}

/* Rating stars */
.rating-stars{color:#d29922;font-size:.75rem;letter-spacing:1px}
.rating-empty{color:#30363d;font-size:.75rem;letter-spacing:1px}

/* Gauntlet badge */
.gauntlet-badge{display:inline-block;background:#1a3a2a;color:#3fb950;font-size:.65rem;padding:1px 6px;border-radius:3px;font-weight:600}

/* Tags filter bar */
.filter-bar{margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.filter-tag{background:#21262d;color:#8b949e;font-size:.72rem;padding:3px 10px;border-radius:12px;cursor:pointer;border:1px solid #30363d;transition:all .1s}
.filter-tag:hover{border-color:#58a6ff;color:#e6edf3}
.filter-tag.active{background:#1f2937;color:#58a6ff;border-color:#58a6ff}

/* Arrow indicators in pipeline */
.stage-arrow{display:none}
@media(min-width:901px){.stage-arrow{display:flex;align-items:center;font-size:1.2rem;color:#30363d;margin:0 -4px}}
</style>
</head>

function formatDate(d) {
  if (!d) return '';
  try { const dt = new Date(d); return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); } catch(e) { return d; }
}

function renderStars(r) {
  if (!r) return '';
  const n = parseInt(r);
  if (isNaN(n)) return '';
  let s = '';
  for(let i=0;i<5;i++) s += i < n ? '<span class="rating-stars">★</span>' : '<span class="rating-empty">★</span>';
  return s;
}

function renderTags(tags) {
  if (!tags) return '';
  try {
    const arr = JSON.parse(tags.replace(/#/g,'"#').replace(/, /g,'","').replace('[','["').replace(']','"]'));
    return arr.map(t => '<span class="file-tag">' + t.replace('#','') + '</span>').join('');
  } catch(e) {
    return '';
  }
}

function renderFrontmatterTable(fm) {
  let keys = Object.keys(fm);
  if (keys.length === 0) return '<div style="color:#8b949e;font-style:italic;padding:4px 0">No frontmatter</div>';
  let html = '<table>';
  keys.forEach(k => {
    let val = fm[k];
    if (k === 'tags') val = renderTags(val);
    else if (k === 'rating') val = renderStars(val) + ' (' + val + '/5)';
    html += '<tr><td>' + k + '</td><td>' + val + '</td></tr>';
  });
  html += '</table>';
  return html;
}

function app() {
  const container = document.getElementById('app');

  // Compute totals
  let totalItems = 0;
  const counts = {};
  STAGES.forEach(s => { counts[s.id] = DATA.stages[s.id].length; totalItems += DATA.stages[s.id].length; });
  const maxCount = Math.max(...STAGES.map(s => counts[s.id]), 1);

  // Header
  let html = '<div class="header"><div class="header-left"><h1>🔨 Foundry Content Pipeline</h1><div class="subtitle">Dashboard — AI content workflow tracker</div></div><div class="timestamp">Updated: ' + new Date().toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) + '</div></div>';

  // Pipeline flow bar
  html += '<div class="pipeline">';
  STAGES.forEach(s => {
    const cnt = counts[s.id];
    const pct = maxCount > 0 ? (cnt / maxCount * 100) : 0;
    const emptyClass = cnt === 0 ? ' empty' : '';
    html += '<div class="stage-card' + emptyClass + '" onclick="togglePanel(\'' + s.id + '\')" title="' + s.desc + '">';
    html += '<div class="stage-name">' + s.icon + ' ' + s.name + '</div>';
    html += '<div class="stage-count">' + cnt + '</div>';
    html += '<div class="stage-label">' + s.desc + '</div>';
    html += '<div class="stage-bar" style="width:' + pct + '%;background:' + s.color + '"></div>';
    html += '</div>';
  });
  html += '</div>';

  // Stats row
  const challengeCount = DATA.stages.challenge.length;
  const incubatingCount = DATA.stages.incubate.length;
  html += '<div class="stats-row">';
  html += '<div class="stat-box"><span class="stat-icon">📊</span><div><div class="stat-label">Total Items</div><div class="stat-value">' + totalItems + '</div></div></div>';
  html += '<div class="stat-box"><span class="stat-icon">⚔️</span><div><div class="stat-label">Challenged</div><div class="stat-value">' + challengeCount + '</div></div></div>';
  html += '<div class="stat-box"><span class="stat-icon">🥚</span><div><div class="stat-label">Incubating</div><div class="stat-value">' + incubatingCount + '</div></div></div>';
  html += '<div class="stat-box"><span class="stat-icon">🗂️</span><div><div class="stat-label">Queue</div><div class="stat-value">' + DATA.stages.organize.length + '</div></div></div>';
  html += '<div class="stat-box"><span class="stat-icon">📦</span><div><div class="stat-label">Templates</div><div class="stat-value">' + DATA.templates.length + '</div></div></div>';
  html += '<div class="stat-box"><span class="stat-icon">🗄️</span><div><div class="stat-label">Archived</div><div class="stat-value">' + DATA.stages.archive.length + '</div></div></div>';
  html += '</div>';

  // Detail panels (one per stage)
  html += '<div id="detail-panels">';
  STAGES.forEach(s => {
    const items = DATA.stages[s.id];
    html += '<div class="detail-panel" id="panel-' + s.id + '">';
    html += '<div class="detail-panel-header" onclick="togglePanel(\'' + s.id + '\')">';
    html += '<h3>' + s.icon + ' ' + s.name + ' (' + items.length + ')</h3>';
    html += '<button class="close-btn" onclick="event.stopPropagation();closePanel(\'' + s.id + '\')">✕</button>';
    html += '</div>';
    html += '<div class="detail-panel-body">';
    if (items.length === 0) {
      html += '<div class="empty-msg">No files in this stage</div>';
    } else {
      html += '<div class="file-grid">';
      items.forEach(f => {
        const fm = f.frontmatter;
        html += '<div class="file-card" onclick="expandFile(this)">';
        html += '<div class="file-name">' + f.filename + '</div>';
        html += '<div class="file-path">' + f.path + '</div>';
        html += '<div class="file-meta">';
        if (fm.date) html += '<span>📅 ' + formatDate(fm.date) + '</span>';
        if (fm.rating) html += '<span>' + renderStars(fm.rating) + '</span>';
        if (fm.gauntlet_score) html += '<span class="gauntlet-badge">🧪 ' + fm.gauntlet_score + '</span>';
        if (fm.content_type) html += '<span style="background:#1f2937;color:#bc8cff;padding:1px 6px;border-radius:3px;font-size:.65rem">' + fm.content_type + '</span>';
        html += '</div>';
        if (fm.tags) html += '<div class="file-tags">' + renderTags(fm.tags) + '</div>';
        if (fm.suggested_angle) html += '<div class="file-angle">' + fm.suggested_angle.substring(0, 120) + (fm.suggested_angle.length > 120 ? '…' : '') + '</div>';
        html += '<div class="file-frontmatter">' + renderFrontmatterTable(fm) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  // Templates section
  html += '<div class="templates-section">';
  html += '<h2>📁 Templates (' + DATA.templates.length + ')</h2>';
  html += '<div class="templates-grid">';
  DATA.templates.forEach(t => {
    html += '<div class="template-card">';
    html += '<div class="tpl-name">📄 ' + t.filename + '</div>';
    html += '<div class="tpl-path">' + t.path + '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // Footer
  html += '<div class="footer">Foundry Dashboard • ' + totalItems + ' active items • ' + DATA.templates.length + ' templates • Built with ❤️</div>';

  container.innerHTML = html;
}

function togglePanel(id) {
  const panel = document.getElementById('panel-' + id);
  if (!panel) return;
  panel.classList.toggle('open');
}

function closePanel(id) {
  const panel = document.getElementById('panel-' + id);
  if (panel) panel.classList.remove('open');
}

function expandFile(el) {
  const fmDiv = el.querySelector('.file-frontmatter');
  if (fmDiv) fmDiv.classList.toggle('open');
}

app();
</script>
