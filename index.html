function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderStars(n) {
  if (n === null || n === undefined) return '<span class="stars-empty">☆☆☆☆☆</span>';
  n = Math.round(n);
  if (n < 1) n = 1;
  if (n > 5) n = 5;
  let s = '';
  for (let i = 0; i < n; i++) s += '⭐';
  for (let i = n; i < 5; i++) s += '☆';
  return s;
}

function renderTags(tags) {
  if (!tags || !tags.length) return '';
  return tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('');
}

function countClass(count) {
  if (count === 0) return 'count-0';
  if (count <= 10) return 'count-' + count;
  return 'count-many';
}

      (gateHtml ? '<div class="field"><span class="field-label">Gate Check:</span> <span class="field-value">' + gateHtml + '</span></div>' : '') +
      (gauntletScore ? '<div class="field"><span class="field-label">Gauntlet Score:</span> <span class="field-value">' + gauntletScore + '</span></div>' : '') +
      (challengeDate ? '<div class="field"><span class="field-label">Challenge Date:</span> <span class="field-value">' + challengeDate + '</span></div>' : '') +
      (recFormat ? '<div class="field"><span class="field-label">Recommended Format:</span> <span class="field-value">' + recFormat + '</span></div>' : '') +
      '<div class="field"><span class="field-label">Body Preview:</span><div class="body-preview">' + bodyPreview + '</div></div>' +
    '</div>' +
  '</div>';
}

function render() {
  document.getElementById('updated-label').textContent = 'Updated ' + DATA.updated;

  // Pipeline bar
  const stages = DATA.stages;
  const keys = ['capture','incubate','challenge','organize','draft','polish','archive'];
  const bar = document.getElementById('pipeline-bar');
  bar.innerHTML = '';
  keys.forEach(k => {
    const s = stages[k];
    const card = document.createElement('div');
    card.className = 'stage-card';
    card.setAttribute('data-stage', k);
    card.innerHTML = '<div class="count ' + countClass(s.count) + '">' + s.count + '</div><div class="label">' + s.name + '</div>';
    card.addEventListener('click', function() {
      document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      showStage(k);
    });
    bar.appendChild(card);
  });

  // Show first non-empty stage by default
  let firstKey = keys.find(k => stages[k].count > 0);
  if (!firstKey) firstKey = 'capture';
  document.querySelector('.stage-card[data-stage="' + firstKey + '"]').classList.add('active');
  showStage(firstKey);

  // Templates
  const tplDiv = document.getElementById('template-content');
  if (DATA.templates && DATA.templates.items && DATA.templates.items.length > 0) {
    let html = '<div class="template-section"><h2>' + escapeHtml(DATA.templates.name) + ' (' + DATA.templates.items.length + ')</h2>';
    DATA.templates.items.forEach((item, i) => { html += itemHtml(item, i); });
    html += '</div>';
    tplDiv.innerHTML = html;
  }
}

function showStage(key) {
  const s = DATA.stages[key];
  if (!s) return;
  const div = document.getElementById('stage-content');
  if (s.count === 0) {
    div.innerHTML = '<div class="empty-state">No items in ' + s.name + '</div>';
    return;
  }
  let html = '<div class="stage-section"><h2>' + escapeHtml(s.name) + ' <span class="badge">' + s.count + ' items</span></h2>';
  s.items.forEach((item, i) => { html += itemHtml(item, i); });
  html += '</div>';
  div.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
