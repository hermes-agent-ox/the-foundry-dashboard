<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    background: #0d1117;

}
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
.container { max-width: 1400px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #f0f6fc; }
.subtitle { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
.subtitle span { color: #58a6ff; font-weight: 600; }

/* Pipeline Flow Bar */
.pipeline { display: flex; gap: 4px; margin-bottom: 28px; flex-wrap: wrap; }
.stage-card {
    flex: 1; min-width: 120px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 14px 10px; cursor: pointer; transition: all 0.15s ease;
    text-align: center; position: relative;
}
.stage-card:hover { border-color: #58a6ff; background: #1c2128; }
.stage-card.active { border-color: #58a6ff; background: #1c2128; }
.stage-name { font-size: 13px; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
.stage-count { font-size: 28px; font-weight: 700; color: #f0f6fc; }
.stage-arrow { color: #30363d; font-size: 18px; line-height: 56px; flex-shrink: 0; }
.bottleneck {
    display: inline-block; background: #d29922; color: #0d1117;
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 12px;
    margin-top: 4px; white-space: nowrap;
}
.stage-count.zero { color: #484f58; }

/* Stage Detail Panels */
.detail-panel {
    display: none; margin-bottom: 28px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
}
.detail-panel.visible { display: block; }
.panel-header {
    padding: 14px 18px; background: #1c2128; border-bottom: 1px solid #30363d;
    font-size: 15px; font-weight: 600; color: #f0f6fc;
    display: flex; justify-content: space-between; align-items: center;
}
.panel-header .count { color: #8b949e; font-weight: 400; font-size: 13px; }

/* File List */
.file-list { padding: 8px 0; }
.file-entry {
    padding: 10px 18px; border-bottom: 1px solid #21262d; cursor: pointer;
    transition: background 0.1s; display: flex; gap: 12px; align-items: flex-start;
}
.file-entry:hover { background: #1c2128; }
.file-entry:last-child { border-bottom: none; }
.file-info { flex: 1; min-width: 0; }
.file-title { font-size: 14px; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
.file-title .filename { color: #58a6ff; }
.file-meta { font-size: 12px; color: #8b949e; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag-badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 12px;

.tag-badge.pillar { background: #1a3a2e; color: #7ee787; border-color: #238636; }
.tag-badge.bold { background: #3d1f1f; color: #ff7b72; border-color: #da3633; }
.tag-badge.insight { background: #1f2937; color: #d2a8ff; border-color: #6e40c9; }
.tag-badge.observation { background: #1c2128; color: #8b949e; border-color: #30363d; }
.rating-badge {
    font-size: 11px; padding: 1px 6px; border-radius: 8px; font-weight: 500;
}
.rating-5 { background: #1a3a2e; color: #7ee787; border: 1px solid #238636; }
.rating-4 { background: #1f2937; color: #79c0ff; border: 1px solid #30363d; }
.rating-3 { background: #1c2128; color: #8b949e; border: 1px solid #30363d; }
.rating-na { background: #1c2128; color: #484f58; border: 1px solid #21262d; }
.angle-text { color: #8b949e; font-size: 12px; margin-top: 3px; line-height: 1.4; }
.file-expand-icon { color: #484f58; font-size: 14px; margin-top: 3px; flex-shrink: 0; }

/* Expanded File Detail */
.file-detail {
    display: none; padding: 14px 18px; background: #0d1117;
    border-bottom: 1px solid #21262d; font-size: 13px; line-height: 1.6;
}
.file-detail.visible { display: block; }
.detail-label { color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.detail-value { color: #e6edf3; margin-bottom: 12px; word-break: break-word; }
.detail-value a { color: #58a6ff; }
.detail-body { color: #8b949e; white-space: pre-wrap; font-size: 12px; max-height: 200px; overflow-y: auto; background: #161b22; padding: 10px; border-radius: 6px; border: 1px solid #21262d; }

/* Templates Section */
.templates-section {
    margin-top: 32px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
}
.templates-header {
    padding: 14px 18px; background: #1c2128; border-bottom: 1px solid #30363d;
    font-size: 15px; font-weight: 600; color: #f0f6fc;
}
.template-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 16px;
}
.template-card {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 14px;
    transition: border-color 0.15s;
}
.template-card:hover { border-color: #58a6ff; }
.template-name { font-size: 14px; font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
.template-desc { font-size: 12px; color: #8b949e; margin-bottom: 8px; }
.template-path { font-size: 11px; color: #484f58; font-family: 'SF Mono', 'Fira Code', monospace; }

/* Empty state */
.empty-state { text-align: center; padding: 24px; color: #484f58; font-size: 14px; }
</style>
</head>

        `;
        card.onclick = () => togglePanel(stage);
        bar.appendChild(card);

        // Arrow between stages
        if (i < STAGE_ORDER.length - 1) {
            const arrow = document.createElement('div');
            arrow.className = 'stage-arrow';
            arrow.textContent = '→';
            bar.appendChild(arrow);
        }
    });
}

// File detail toggle
function toggleFileDetail(index) {
    const detail = document.getElementById('file-detail-' + index);
    if (detail) {
        const isVisible = detail.classList.contains('visible');
        detail.classList.toggle('visible');
        const icon = detail.parentElement.querySelector('.file-expand-icon');
        if (icon) icon.textContent = isVisible ? '▶' : '▼';
    }
}

// Panel toggle
let activePanel = null;
function togglePanel(stage) {
    const panel = document.getElementById('panel-' + stage);
    if (!panel) return;

    // Update active state on cards
    document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll(`.stage-card[data-stage="${stage}"]`).forEach(c => c.classList.add('active'));

    // Toggle visibility
    const allPanels = document.querySelectorAll('.detail-panel');
    const isSame = panel.classList.contains('visible');

    allPanels.forEach(p => p.classList.remove('visible'));

    if (!isSame) {
        panel.classList.add('visible');
        activePanel = stage;
    } else {
        activePanel = null;
        document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
    }
}

// Tag color
function tagClass(tag) {
    const t = tag.toLowerCase();
    if (['bold-ai', 'bold'].some(x => t.includes(x))) return 'bold';
    if (['insight', 'product-leadership'].some(x => t.includes(x))) return 'insight';
    if (['observation', 'framework'].some(x => t.includes(x))) return 'observation';
    if (['enterprise-ai', 'ai-deployment', 'agent-governance', 'applied-ai', 'talent',
         'agentic-ai', 'agent-adoption', 'audience-care', 'actionability',
         'product', 'leadership', 'adoption', 'governance', 'security',
         'regulation', 'strategy', 'data', 'retail', 'finance', 'health',
         'travel', 'media', 'platform', 'open-weights', 'deployment',
         'mcp', 'voice-agent', 'ransomware', 'ecommerce'].some(x => t.includes(x))) return 'pillar';
    return '';
}

// Render file list
function renderFiles(stage) {
    const files = DATA.files.filter(f => f.stage === stage);
    const panel = document.getElementById('panel-' + stage);
    if (!panel) return '';
    const list = panel.querySelector('.file-list');
    list.innerHTML = '';

    if (files.length === 0) {
        list.innerHTML = '<div class="empty-state">No files in this stage</div>';
        return;
    }

    files.forEach((f, idx) => {
        const entry = document.createElement('div');
        entry.className = 'file-entry';
        entry.innerHTML = `
            <div class="file-info">
                <div class="file-title"><span class="filename">${f.filename}</span></div>
                <div class="file-meta">
                    ${f.date ? '<span>📅 ' + f.date + '</span>' : ''}
                    ${f.rating ? '<span class="rating-badge rating-' + (parseInt(f.rating) >= 4 ? parseInt(f.rating) : (parseInt(f.rating)||0)) + '">★ ' + f.rating + '</span>' : '<span class="rating-badge rating-na">—</span>'}
                    ${f.gauntlet_score ? '<span style="color:#d29922;font-weight:600;">' + f.gauntlet_score + '</span>' : ''}
                    ${f.tags.map(t => '<span class="tag-badge ' + tagClass(t) + '">#' + t + '</span>').join(' ')}
                </div>
                ${f.suggested_angle ? '<div class="angle-text">' + f.suggested_angle.slice(0,120) + (f.suggested_angle.length > 120 ? '…' : '') + '</div>' : ''}
            </div>
            <div class="file-expand-icon">▶</div>
        `;
        entry.onclick = () => toggleFileDetail(f.path.replace(/[\/\.]/g,'-'));
        list.appendChild(entry);

        // Detail section
        const detail = document.createElement('div');
        detail.className = 'file-detail';
        detail.id = 'file-detail-' + f.path.replace(/[\/\.]/g,'-');
        detail.innerHTML = `
            ${f.source ? '<div class="detail-label">Source</div><div class="detail-value"><a href="' + f.source.replace(/"/g,'&quot;') + '" target="_blank">' + f.source + '</a></div>' : ''}
            ${f.suggested_angle ? '<div class="detail-label">Suggested Angle</div><div class="detail-value">' + f.suggested_angle + '</div>' : ''}
            ${f.heading ? '<div class="detail-label">Heading</div><div class="detail-value">' + f.heading + '</div>' : ''}
            ${f.challenge_date ? '<div class="detail-label">Challenge Date</div><div class="detail-value">' + f.challenge_date + '</div>' : ''}
            ${f.gauntlet_score ? '<div class="detail-label">Gauntlet Score</div><div class="detail-value">' + f.gauntlet_score + '</div>' : ''}
            ${f.gate_check ? '<div class="detail-label">Gate Check</div><div class="detail-value">' + f.gate_check + (f.gate_check_reason ? ': ' + f.gate_check_reason : '') + '</div>' : ''}
            ${f.content_type ? '<div class="detail-label">Content Type</div><div class="detail-value">' + f.content_type + '</div>' : ''}
            ${f.body_preview ? '<div class="detail-label">Body Preview</div><div class="detail-body">' + f.body_preview + '</div>' : ''}
            <div class="detail-label">Path</div>
            <div class="detail-value" style="font-family:monospace;font-size:11px;color:#484f58;">{f.path}</div>
        `;
        list.appendChild(detail);
    });
}

// Render all panels
function renderPanels() {
    const container = document.getElementById('detail-panels');
    container.innerHTML = '';
    STAGE_ORDER.forEach(stage => {
        const count = DATA.stage_counts[stage] || 0;
        const panel = document.createElement('div');
        panel.className = 'detail-panel';
        panel.id = 'panel-' + stage;
        panel.innerHTML = `
            <div class="panel-header">
                <span>${STAGE_LABELS[stage]||''} ${stage} Pipeline</span>
                <span class="count">${count} file${count !== 1 ? 's' : ''}</span>
            </div>
            <div class="file-list"></div>
        `;
        container.appendChild(panel);
        renderFiles(stage);
    });
}

// Render templates
function renderTemplates() {
    const grid = document.getElementById('template-grid');
    grid.innerHTML = '';
    DATA.templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'template-card';
        card.innerHTML = `
            <div class="template-name">📄 ${t.name}</div>
            <div class="template-desc">${t.desc}</div>
            <div class="template-path">${t.path}</div>
        `;
        grid.appendChild(card);
    });
}

// Init
renderPipeline();
renderPanels();
renderTemplates();
</script>
