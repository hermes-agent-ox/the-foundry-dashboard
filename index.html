<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-yellow: #d29922;
    --accent-red: #f85149;
    --accent-purple: #bc8cff;
    --accent-orange: #f0883e;
    --accent-gray: #8b949e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 24px;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  
  /* Header */
  .header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 4px;
  }
  .header .stats-row {
    display: flex;
    gap: 24px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .stat-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
  }
  .stat-badge .num {
    font-weight: 700;
    font-size: 15px;
  }
  .stat-badge.warn {
    border-color: var(--accent-red);
    color: var(--accent-red);
  }
  .stat-badge.ok {
    border-color: var(--accent-green);
    color: var(--accent-green);
  }

  /* Pipeline Flow Bar */
  .pipeline-flow {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 32px;
    padding: 16px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  .stage-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 100px;
    border: 1px solid transparent;
    background: var(--bg-tertiary);
    position: relative;
    flex-shrink: 0;
  }
  .stage-card:hover {
    transform: translateY(-2px);
    border-color: var(--border);
  }
  .stage-card .icon { font-size: 20px; margin-bottom: 4px; }
  .stage-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stage-card .count { font-size: 22px; font-weight: 700; }
  .stage-card.bottleneck {
    border-color: var(--accent-orange);
    animation: pulse 2s ease-in-out infinite;
  }
  .stage-card.bottleneck::after {
    content: '⚠ BOTTLENECK';
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--accent-orange);
    color: #000;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240, 136, 62, 0.4); }
    50% { box-shadow: 0 0 0 6px rgba(240, 136, 62, 0); }
  }
  .pipeline-arrow {
    font-size: 18px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* Stage Panels */
  .stage-panel {
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .stage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    background: var(--bg-secondary);
    transition: background 0.2s;
    user-select: none;
  }
  .stage-header:hover { background: var(--bg-tertiary); }
  .stage-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stage-header .icon { font-size: 18px; }
  .stage-header .sname { font-size: 16px; font-weight: 600; }
  .stage-header .scount {
    background: var(--bg-tertiary);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .stage-header .toggle { 
    color: var(--text-muted); 
    font-size: 16px;
    transition: transform 0.2s;
  }
  .stage-header .toggle.open { transform: rotate(180deg); }
  
  .stage-content { 
    display: none;
    padding: 0;
    background: var(--bg-primary);
  }
  .stage-content.open { display: block; }

  /* File Cards */
  .file-card {
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    margin: 0;
    transition: background 0.15s;
  }
  .file-card:last-child { border-bottom: none; }
  .file-card:hover { background: rgba(255,255,255,0.02); }
  .file-card .file-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    gap: 12px;
  }
  .file-card .file-title {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-card .file-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .file-card .file-meta .tag {
    font-size: 11px;
    background: var(--bg-tertiary);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--text-secondary);
  }
  .file-card .file-meta .rating {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .rating-5 { color: var(--accent-yellow); background: rgba(210,153,34,0.15); }
  .rating-4 { color: var(--accent-blue); background: rgba(88,166,255,0.15); }
  .rating-3 { color: var(--text-secondary); background: rgba(139,148,158,0.15); }
  
  .file-card .file-body { 
    display: none;
    margin-top: 10px;
    padding: 12px;
    background: var(--bg-tertiary);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .file-card .file-body.open { display: block; }

  .file-card .file-details {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .file-card .file-details .detail {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-tertiary);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .file-card .file-details .detail strong { color: var(--text-secondary); }

  /* Templates Section */
  .template-card {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .template-card:last-child { border-bottom: none; }
  .template-card .tmpl-name { color: var(--text-primary); font-weight: 600; }
  .template-card .tmpl-path { color: var(--text-muted); font-size: 11px; }

  /* Empty state */
  .empty-state {
    padding: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Tags grid */
  .tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .tags-row .t {
    font-size: 10px;
    background: rgba(88,166,255,0.1);
    color: var(--accent-blue);
    padding: 1px 6px;
    border-radius: 3px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

function init() {
  renderStats();
  renderPipelineFlow();
  renderStagePanels();
  renderTemplates();
}

function renderStats() {
  const row = document.getElementById('stats-row');
  const d = PIPELINE;
  let html = `<span class="stat-badge">Total Files <span class="num">${d.total_files}</span></span>`;
  html += `<span class="stat-badge">Templates <span class="num">${d.templates.length}</span></span>`;
  
  for (const s of d.stages) {
    const cnt = d.stage_counts[s] || 0;
    const color = d.stage_colors[s];
    html += `<span class="stat-badge" style="border-left: 3px solid ${color}">${d.stage_icons[s]} ${s} <span class="num">${cnt}</span></span>`;
  }

  if (d.bottleneck_stages.length > 0) {
    html += `<span class="stat-badge warn">⚠ Bottleneck: ${d.bottleneck_stages.join(', ')}</span>`;
  }
  if (!d.count_match) {
    html += `<span class="stat-badge warn">⚠ Count mismatch: JSON=${d.total_files}, FS=${d.find_verify_count}</span>`;
  } else {
    html += `<span class="stat-badge ok">✓ Count verified (${d.find_verify_count})</span>`;
  }
  row.innerHTML = html;
}

function renderPipelineFlow() {
  const flow = document.getElementById('pipeline-flow');
  const d = PIPELINE;
  let html = '';
  d.stages.forEach((s, i) => {
    const cnt = d.stage_counts[s] || 0;
    const color = d.stage_colors[s];
    const isBottleneck = d.bottleneck_stages.includes(s);
    html += `<div class="stage-card ${isBottleneck ? 'bottleneck' : ''}" style="border-top: 3px solid ${color}" onclick="scrollToStage('${s}')">
      <div class="icon">${d.stage_icons[s]}</div>
      <div class="label">${s}</div>
      <div class="count" style="color:${color}">${cnt}</div>
    </div>`;
    if (i < d.stages.length - 1) {
      html += '<div class="pipeline-arrow">→</div>';
    }
  });
  flow.innerHTML = html;
}

function renderStagePanels() {
  const container = document.getElementById('stage-panels');
  const d = PIPELINE;
  let html = '';
  d.stages.forEach(s => {
    const files = d.stage_files[s] || [];
    const cnt = d.stage_counts[s] || 0;
    const color = d.stage_colors[s];
    html += `<div class="stage-panel">
      <div class="stage-header" onclick="togglePanel(this)" style="border-left: 4px solid ${color}">
        <div class="stage-header-left">
          <span class="icon">${d.stage_icons[s]}</span>
          <span class="sname">${s}</span>
          <span class="scount">${cnt} files</span>
        </div>
        <span class="toggle">▼</span>
      </div>
      <div class="stage-content">`;
    
    if (files.length === 0) {
      html += '<div class="empty-state">No files in this stage</div>';
    } else {
      files.forEach(f => {
        const ratingClass = f.rating ? `rating-${f.rating}` : '';
        const ratingHtml = f.rating ? `<span class="rating ${ratingClass}">${f.rating}/5</span>` : '';
        const dateHtml = f.date ? `<span class="detail"><strong>Date:</strong> ${f.date}</span>` : '';
        const srcHtml = f.source ? `<span class="detail"><strong>Source:</strong> ${escapeHtml(f.source).substring(0, 60)}...</span>` : '';
        const angleHtml = f.suggested_angle ? `<span class="detail"><strong>Angle:</strong> ${escapeHtml(f.suggested_angle).substring(0, 80)}...</span>` : '';
        const gcHtml = f.gate_check ? `<span class="detail"><strong>Gate:</strong> ${f.gate_check}</span>` : '';
        const gsHtml = f.gauntlet_score ? `<span class="detail"><strong>Gauntlet:</strong> ${f.gauntlet_score}</span>` : '';
        const fmtHtml = f.recommended_format ? `<span class="detail"><strong>Format:</strong> ${f.recommended_format}</span>` : '';
        const subdirHtml = f.subdir ? `<span class="detail"><strong>Sub:</strong> ${f.subdir}</span>` : '';
        
        const tagsHtml = f.tags && f.tags.length > 0 
          ? `<div class="tags-row">${f.tags.map(t => `<span class="t">${escapeHtml(t)}</span>`).join('')}</div>` 
          : '';
        
        const bodyPreview = f.body_preview ? escapeHtml(f.body_preview) : '';
        
        html += `<div class="file-card">
          <div class="file-header" onclick="toggleFileBody(this)">
            <span class="file-title">${escapeHtml(f.filename)}</span>
            <div class="file-meta">
              ${subdirHtml ? `<span class="tag">${escapeHtml(f.subdir)}</span>` : ''}
              ${ratingHtml}
              <span class="tag">${escapeHtml(f.path)}</span>
            </div>
          </div>
          <div class="file-details">
            ${dateHtml}${gcHtml}${gsHtml}${fmtHtml}
          </div>
          ${tagsHtml}
          <div class="file-body">${bodyPreview}</div>
        </div>`;
      });
    }
    
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function renderTemplates() {
  const tpl = PIPELINE.templates;
  document.getElementById('tpl-count').textContent = tpl.length + ' files';
  const container = document.getElementById('templates-content');
  if (tpl.length === 0) {
    container.innerHTML = '<div class="empty-state">No templates found</div>';
    return;
  }
  let html = '';
  tpl.forEach(t => {
    const preview = escapeHtml(t.content_preview || '');
    html += `<div class="template-card">
      <div class="tmpl-name">📄 ${escapeHtml(t.filename)}</div>
      <div class="tmpl-path">${escapeHtml(t.path)}</div>
      <div style="margin-top:4px;font-size:11px;color:var(--text-muted);white-space:pre-wrap">${preview.substring(0, 200)}${preview.length > 200 ? '...' : ''}</div>
    </div>`;
  });
  container.innerHTML = html;
}

function togglePanel(el) {
  const content = el.nextElementSibling;
  const toggle = el.querySelector('.toggle');
  content.classList.toggle('open');
  toggle.classList.toggle('open');
}

function toggleFileBody(el) {
  const card = el.closest('.file-card');
  const body = card.querySelector('.file-body');
  body.classList.toggle('open');
}

function scrollToStage(stage) {
  const panels = document.querySelectorAll('.stage-panel');
  for (const p of panels) {
    const header = p.querySelector('.stage-header');
    const label = header.querySelector('.sname');
    if (label && label.textContent === stage) {
      const content = p.querySelector('.stage-content');
      content.classList.add('open');
      header.querySelector('.toggle').classList.add('open');
      p.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

document.addEventListener('DOMContentLoaded', init);
