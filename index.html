const STAGE_ICONS = {"Capture":"📥","Incubate":"🥚","Challenge":"⚔️","Organize":"📋","Draft":"✍️","Polish":"✨","Archive":"📦"};
const STAGE_COLORS = {"Capture":"#238636","Incubate":"#9e6a03","Challenge":"#da3633","Organize":"#1f6feb","Draft":"#8957e5","Polish":"#3fb950","Archive":"#8b949e"};
const STAGE_ORDER = ["Capture","Incubate","Challenge","Organize","Draft","Polish","Archive"];

function tagColor(tag) {
  const colors = {
    "#idea":"#58a6ff","#ai-deployment":"#3fb950","#applied-ai":"#d2a8ff","#enterprise-ai":"#ffa657",
    "#retail-ai":"#f0883e","#agent-governance":"#f85149","#bold-ai":"#ff7b72","#insight":"#79c0ff",
    "#framework":"#7ee787","#product-leadership":"#e3b341","#org-design":"#d2a8ff","#diamond":"#56d4dd",
    "#observation":"#8b949e","#ai-safety":"#f85149","#security":"#ff7b72","#adoption":"#3fb950",
    "#regulation":"#ffa657","#infrastructure":"#58a6ff","#strategy":"#d2a8ff"
  };
  return colors[tag] || "#8b949e";
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPipelineBar() {
  const bar = document.getElementById('pipelineBar');
  bar.innerHTML = '';
  STAGE_ORDER.forEach(stage => {
    const files = DATA.stages[stage].files;
    const count = files.length;
    const isMidEmpty = (stage !== 'Capture' && stage !== 'Archive' && count === 0);
    const card = document.createElement('div');
    card.className = 'stage-card';
    card.innerHTML = `<div class="stage-icon">${STAGE_ICONS[stage]}</div>
      <div class="stage-name">${stage}</div>
      <div class="stage-count" style="color:${STAGE_COLORS[stage]}">${count}</div>
      <div class="stage-count-label">files</div>
      ${isMidEmpty ? '<div class="bottleneck-badge">⚠️ BOTTLENECK</div>' : ''}`;
    card.onclick = () => showStage(stage);
    bar.appendChild(card);
  });
}

function showStage(stage) {
  const panel = document.getElementById('detailPanel');
  const title = document.getElementById('panelTitle');
  const list = document.getElementById('fileList');
  const files = DATA.stages[stage].files;

  title.textContent = `${STAGE_ICONS[stage]} ${stage} (${files.length} files)`;
  list.innerHTML = '';

  if (files.length === 0) {
    list.innerHTML = '<div class="empty-state">No files in this stage</div>';
  } else {
    files.forEach((f, idx) => {
      const ratingVal = f.rating ? parseInt(f.rating) : 0;
      const ratingCol = ratingVal >= 5 ? '#3fb950' : ratingVal >= 3 ? '#d29922' : '#8b949e';
      const tagsHtml = (f.tags || []).map(t => `<span class="tag-badge" style="background:${tagColor(t)}22;color:${tagColor(t)};border:1px solid ${tagColor(t)}44">${esc(t)}</span>`).join(' ');

      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `<div class="file-card-header">
        <div class="file-name">${esc(f.filename)}</div>
        <div class="file-date">${esc(f.date)}</div>
      </div>
      <div class="file-meta">
        <span class="file-rating" style="background:${ratingCol}22;color:${ratingCol};border:1px solid ${ratingCol}44">★ ${esc(f.rating) || 'N/A'}</span>
        ${tagsHtml}
      </div>
      <div class="file-angle">${esc(f.suggested_angle ? f.suggested_angle.slice(0,100) + (f.suggested_angle.length>100?'...':'') : '')}</div>
      <div class="file-expand" id="expand-${stage}-${idx}">
        <div class="expand-content">
          ${f.source_url ? `<p><strong>Source:</strong> <a href="${esc(f.source_url)}" target="_blank">${esc(f.source_url)}</a></p>` : ''}
          ${f.suggested_angle ? `<p><strong>Full Angle:</strong> ${esc(f.suggested_angle)}</p>` : ''}
          ${f.challenge_date ? `<p><strong>Challenge Date:</strong> ${esc(f.challenge_date)}</p>` : ''}
          ${f.gauntlet_score ? `<p><strong>Gauntlet Score:</strong> ${esc(f.gauntlet_score)}</p>` : ''}
          <p><strong>Preview:</strong></p>
          <p>${esc(f.preview)}</p>
        </div>
      </div>`;

      card.onclick = (e) => {
        // Don't toggle if clicking a link
        if (e.target.tagName === 'A') return;
        const expand = document.getElementById(`expand-${stage}-${idx}`);
        expand.classList.toggle('open');
      };
      list.appendChild(card);
    });
  }

  panel.classList.add('visible');

  // Highlight active card
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
  const cards = document.querySelectorAll('.stage-card');
  const idx = STAGE_ORDER.indexOf(stage);
  if (cards[idx]) cards[idx].classList.add('active');
}

function closePanel() {
  document.getElementById('detailPanel').classList.remove('visible');
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
}

function renderTemplates() {
  const grid = document.getElementById('templateGrid');
  if (!DATA.templates || DATA.templates.length === 0) {
    grid.innerHTML = '<div class="empty-state">No templates found</div>';
    return;
  }
  DATA.templates.forEach(t => {
    const card = document.createElement('div');
    card.className = 'template-card';
    card.innerHTML = `<div class="template-name">${esc(t.filename)}</div>
      <div class="template-type">${esc(t.type)}${t.purpose ? ' — ' + esc(t.purpose) : ''}</div>`;
    grid.appendChild(card);
  });
}

function renderStats() {
  const total = STAGE_ORDER.reduce((sum, s) => sum + DATA.stages[s].files.length, 0);
  const drafts = DATA.stages['Draft'].files.length;
  const polished = DATA.stages['Polish'].files.length;
  const archived = DATA.stages['Archive'].files.length;
  const active = total - archived;
  document.getElementById('statsRow').innerHTML = `
    <span>📊 Total: <strong>${total}</strong> files</span>
    <span>📝 Active: <strong>${active}</strong></span>
    <span>✍️ Drafts: <strong>${drafts}</strong></span>
    <span>✨ Polished: <strong>${polished}</strong></span>
    <span>📦 Archived: <strong>${archived}</strong></span>`;
}

// Initialize
renderStats();
renderPipelineBar();
renderTemplates();
</script>
</body>
</html>
