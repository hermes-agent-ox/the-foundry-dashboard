(function() {
  var stages = DATA.stages;
  var pipelineBar = document.getElementById('pipelineBar');
  var panels = document.getElementById('panels');
  var statsBar = document.getElementById('statsBar');
  var templatesSection = document.getElementById('templatesSection');
  var templatesGrid = document.getElementById('templatesGrid');

  // Stats bar
  var totalFiles = DATA.totalFiles || 0;
  var bottleneckStages = [];
  for (var i = 0; i < stages.length; i++) {
    if (i > 0 && i < stages.length - 1 && stages[i].count === 0) {
      bottleneckStages.push(stages[i].name);
    }
  }
  var statsHTML = '<span>📁 ' + totalFiles + ' files</span>';
  if (bottleneckStages.length > 0) {
    statsHTML += '<span style="color:#d29922;">⚠️ Bottleneck: ' + bottleneckStages.join(', ') + '</span>';
  }
  statsBar.innerHTML = statsHTML;

  // Pipeline bar
  for (var si = 0; si < stages.length; si++) {
    var stage = stages[si];
    var isBottleneck = si > 0 && si < stages.length - 1 && stage.count === 0;
    var card = document.createElement('div');
    card.className = 'stage-card' + (isBottleneck ? ' bottleneck' : '');
    card.setAttribute('data-index', si);
    var innerHTML = '<div class="count">' + stage.count + '</div>';
    innerHTML += '<div class="label">' + stage.name + '</div>';
    if (isBottleneck) {
      innerHTML += '<div class="badge">⚠️ EMPTY</div>';
    }
    card.innerHTML = innerHTML;
    card.addEventListener('click', (function(idx) {
      return function() { togglePanel(idx); };
    })(si));
    pipelineBar.appendChild(card);
  }

  // Panels
  for (var pi = 0; pi < stages.length; pi++) {
    var stg = stages[pi];
    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + pi;

    var filesHTML = '';
    if (stg.files.length === 0) {
      filesHTML = '<div class="no-files">No files in this stage</div>';
    } else {
      filesHTML = '<div class="file-grid">';
      for (var fi = 0; fi < stg.files.length; fi++) {
        var file = stg.files[fi];
        var tagSpans = '';
        if (file.tags && file.tags.length > 0) {
          for (var ti = 0; ti < file.tags.length; ti++) {
            var t = file.tags[ti].replace('#', '');
            tagSpans += '<span class="tag">#' + t + '</span> ';
          }
        }
        var ratingHTML = '';
        if (file.rating !== null && file.rating !== undefined) {
          var r = parseInt(file.rating);
          if (!isNaN(r)) {
            ratingHTML = '<span class="rating rating-' + r + '">★ ' + r + '/5</span>';
          }
        }
        var angle = file.suggested_angle || '';
        var angleShort = angle.length > 120 ? angle.substring(0, 120) + '…' : angle;
        var dateStr = file.date || file.created || '';
        var source = file.source || '';
        var bodyPreview = file.body_preview || '';

        filesHTML += '<div class="file-card" onclick="toggleDetail(' + pi + ',' + fi + ')">';
        filesHTML += '<div class="filename">' + escHtml(file.name) + '</div>';
        filesHTML += '<div class="meta">';
        if (dateStr) filesHTML += '<span>📅 ' + escHtml(dateStr) + '</span>';
        if (ratingHTML) filesHTML += ratingHTML;
        if (file.stage) filesHTML += '<span>📍 ' + escHtml(file.stage) + '</span>';
        filesHTML += '</div>';
        if (tagSpans) filesHTML += '<div class="tags">' + tagSpans + '</div>';
        if (angle) filesHTML += '<div class="angle-snippet">' + escHtml(angleShort) + '</div>';
        filesHTML += '<div class="file-detail" id="detail-' + pi + '-' + fi + '">';
        if (source) {
          filesHTML += '<div class="detail-label">Source</div>';
          filesHTML += '<div class="detail-value"><a href="' + escAttr(source) + '" target="_blank">' + escHtml(source) + '</a></div>';
        }
        if (angle) {
          filesHTML += '<div class="detail-label">Suggested Angle</div>';
          filesHTML += '<div class="detail-value">' + escHtml(angle) + '</div>';
        }
        if (file.gauntlet_score) {
          filesHTML += '<div class="detail-label">Gauntlet Score</div>';
          filesHTML += '<div class="detail-value">' + escHtml(file.gauntlet_score) + '</div>';
        }
        if (file.gate_check) {
          var gate = escHtml(file.gate_check);
          if (file.gate_check_reason) gate += ' — ' + escHtml(file.gate_check_reason);
          filesHTML += '<div class="detail-label">Gate Check</div><div class="detail-value">' + gate + '</div>';
        }
        if (bodyPreview) {
          filesHTML += '<div class="detail-label">Body Preview</div>';
          filesHTML += '<div class="body-preview">' + escHtml(bodyPreview) + '</div>';
        }
        filesHTML += '</div></div>';
      }
      filesHTML += '</div>';
    }

    panel.innerHTML = '<h2>' + stg.name + ' (' + stg.count + ' files)</h2>' + filesHTML;
    panels.appendChild(panel);
  }

  // Templates section
  if (DATA.templates && DATA.templates.length > 0) {
    templatesSection.style.display = 'block';
    for (var ti2 = 0; ti2 < DATA.templates.length; ti2++) {
      var tpl = DATA.templates[ti2];
      var card = document.createElement('div');
      card.className = 'template-card';
      var preview = (tpl.content || '').substring(0, 200).replace(/</g, '&lt;').replace(/>/g, '&gt;');
      card.innerHTML = '<div class="tname">📄 ' + escHtml(tpl.name) + '</div>' +
        '<div class="tpath">' + escHtml(tpl.path) + (tpl.stage ? ' — ' + escHtml(tpl.stage) : '') + '</div>' +
        '<div class="tpreview">' + preview + '</div>';
      templatesGrid.appendChild(card);
    }
  }

  // Open first panel by default
  togglePanel(0);
})();

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function togglePanel(idx) {
  var panel = document.getElementById('panel-' + idx);
  var cards = document.querySelectorAll('.stage-card');
  var isOpen = panel.classList.contains('open');

  // Close all panels
  var allPanels = document.querySelectorAll('.panel');
  for (var i = 0; i < allPanels.length; i++) allPanels[i].classList.remove('open');
  for (var i2 = 0; i2 < cards.length; i2++) cards[i2].classList.remove('active');

  if (!isOpen) {
    panel.classList.add('open');
    cards[idx].classList.add('active');
  }
}

function toggleDetail(stageIdx, fileIdx) {
  var el = document.getElementById('detail-' + stageIdx + '-' + fileIdx);
  if (el) el.classList.toggle('open');
}
</script>
