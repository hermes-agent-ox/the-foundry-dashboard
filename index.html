<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundry Pipeline Dashboard</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border-color: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-orange: #d29922;
    --accent-red: #f85149;
    --accent-purple: #bc8cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  
  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0; margin-bottom: 24px;
    border-bottom: 1px solid var(--border-color);
  }
  .header h1 {
    font-size: 24px; font-weight: 600;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .meta {
    font-size: 13px; color: var(--text-secondary);
  }
  .header .meta span { margin-left: 16px; }

  /* Pipeline Flow Bar */
  .pipeline-flow {
    display: flex; gap: 8px; margin-bottom: 32px;
    overflow-x: auto; padding: 4px 0;
  }
  .stage-card {
    flex: 1; min-width: 130px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    text-align: center;
  }
  .stage-card:hover {
    border-color: var(--accent-blue);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(88,166,255,0.15);
  }
  .stage-card.active {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(88,166,255,0.3);
  }
  .stage-card .stage-icon {
    font-size: 20px; margin-bottom: 4px;
  }
  .stage-card .stage-name {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stage-card .stage-count {
    font-size: 28px; font-weight: 700; margin: 4px 0;
  }
  .stage-card .stage-arrow {
    font-size: 10px; color: var(--text-muted);
    margin-top: 4px;
  }
  .stage-card .bottleneck-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--accent-orange); color: #000;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 12px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* Flow Arrows between cards */
  .flow-row {
    display: flex; align-items: center; gap: 0;
    margin-bottom: 24px;
  }
  .flow-arrow {
    color: var(--text-muted); font-size: 18px;
    padding: 0 4px; flex-shrink: 0;
  }

  /* Stage Detail Panels */
  .stage-panel {
    display: none;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .stage-panel.visible { display: block; }
  .stage-panel h2 {
    font-size: 18px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .stage-panel h2 .badge {
    font-size: 12px; font-weight: 500;
    padding: 2px 10px; border-radius: 12px;
    background: var(--bg-tertiary); color: var(--text-secondary);
  }

  /* File Cards */
  .file-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .file-card:hover { border-color: var(--accent-blue); }
  .file-card .file-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px;
  }
  .file-card .file-title {
    font-size: 14px; font-weight: 500; flex: 1;
    color: var(--text-primary);
  }
  .file-card .file-meta {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .file-card .file-date {
    font-size: 12px; color: var(--text-muted);
  }
  .file-card .file-rating {
    font-size: 12px; font-weight: 600;
    padding: 1px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.05);
  }
  .file-card .file-rating.r5 { color: #ff7b72; }
  .file-card .file-rating.r4 { color: #d29922; }
  .file-card .file-rating.r3 { color: #58a6ff; }
  .file-card .file-rating.r2 { color: #8b949e; }
  .file-card .file-rating.r1 { color: #484f58; }

  /* Tags */
  .tags-row {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 6px;
  }
  .tag {
    font-size: 11px; padding: 1px 8px;
    border-radius: 10px;
    background: rgba(88,166,255,0.12);
    color: var(--accent-blue);
    border: 1px solid rgba(88,166,255,0.2);
  }
  .tag.tag-ai-deployment { background: rgba(63,185,80,0.12); color: var(--accent-green); border-color: rgba(63,185,80,0.2); }
  .tag.tag-enterprise-ai { background: rgba(188,140,255,0.12); color: var(--accent-purple); border-color: rgba(188,140,255,0.2); }
  .tag.tag-observation { background: rgba(139,148,158,0.12); color: var(--text-secondary); border-color: rgba(139,148,158,0.2); }
  .tag.tag-contrarian { background: rgba(248,81,73,0.12); color: var(--accent-red); border-color: rgba(248,81,73,0.2); }
  .tag.tag-bold-ai { background: rgba(210,168,255,0.12); color: #d2a8ff; border-color: rgba(210,168,255,0.2); }
  .tag.tag-diamond { background: rgba(210,153,34,0.12); color: var(--accent-orange); border-color: rgba(210,153,34,0.2); }
  .tag.tag-insight { background: rgba(121,192,255,0.12); color: #79c0ff; border-color: rgba(121,192,255,0.2); }
  .tag.tag-framework { background: rgba(63,185,80,0.12); color: var(--accent-green); border-color: rgba(63,185,80,0.2); }
  .tag.tag-adoption-psychology { background: rgba(255,123,114,0.12); color: #ff7b72; border-color: rgba(255,123,114,0.2); }
  .tag.tag-product-leadership { background: rgba(210,168,255,0.12); color: #d2a8ff; border-color: rgba(210,168,255,0.2); }
  .tag.tag-applied-ai { background: rgba(121,192,255,0.12); color: #79c0ff; border-color: rgba(121,192,255,0.2); }
  .tag.tag-agent-governance { background: rgba(248,81,73,0.12); color: var(--accent-red); border-color: rgba(248,81,73,0.2); }
  .tag.tag-retail-ai { background: rgba(63,185,80,0.12); color: var(--accent-green); border-color: rgba(63,185,80,0.2); }
  .tag.tag-talent { background: rgba(188,140,255,0.12); color: var(--accent-purple); border-color: rgba(188,140,255,0.2); }
  .tag.tag-org-design { background: rgba(210,153,34,0.12); color: var(--accent-orange); border-color: rgba(210,153,34,0.2); }
  .tag.tag-saaspocalypse { background: rgba(248,81,73,0.12); color: var(--accent-red); border-color: rgba(248,81,73,0.2); }
  .tag.tag-sovereign-ai { background: rgba(121,192,255,0.12); color: #79c0ff; border-color: rgba(121,192,255,0.2); }
  .tag.tag-federal-procurement { background: rgba(210,153,34,0.12); color: var(--accent-orange); border-color: rgba(210,153,34,0.2); }
  .tag.tag-cryptography { background: rgba(188,140,255,0.12); color: var(--accent-purple); border-color: rgba(188,140,255,0.2); }
  .tag.tag-benchmarks { background: rgba(63,185,80,0.12); color: var(--accent-green); border-color: rgba(63,185,80,0.2); }
  .tag.tag-open-weights { background: rgba(121,192,255,0.12); color: #79c0ff; border-color: rgba(121,192,255,0.2); }
  .tag.tag-research-access { background: rgba(210,168,255,0.12); color: #d2a8ff; border-color: rgba(210,168,255,0.2); }
  .tag.tag-security { background: rgba(248,81,73,0.12); color: var(--accent-red); border-color: rgba(248,81,73,0.2); }

  /* Expanded file details */
  .file-details {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-color);
  }
  .file-details.visible { display: block; }
  .file-details .detail-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .file-details .detail-value {
    font-size: 13px; color: var(--text-secondary);
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .file-details .detail-value a {
    color: var(--accent-blue);
    text-decoration: none;
    word-break: break-all;
  }
  .file-details .detail-value a:hover { text-decoration: underline; }
  .file-details .preview-block {
    background: rgba(13,17,23,0.5);
    border-radius: 4px;
    padding: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
  }

  /* Templates section */
  .templates-section {
    margin-top: 32px;
    padding: 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
  }
  .templates-section h2 {
    font-size: 16px; font-weight: 600; margin-bottom: 12px;
    color: var(--text-muted);
  }
  .template-list {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .template-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    transition: all 0.15s;
  }
  .template-item:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .template-item .tpl-stage {
    font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 8px;
    background: rgba(255,255,255,0.05);
  }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 32px;
    color: var(--text-muted); font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .pipeline-flow { flex-wrap: wrap; }
    .stage-card { min-width: calc(33% - 8px); }
    .header { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
  @media (max-width: 480px) {
    .stage-card { min-width: calc(50% - 4px); }
  }
</style>
</head>

const STAGE_META = {
  Capture: { icon: "&#128221;", color: "#7ee787", bg: "#1a3a2a", border: "#238636" },
  Incubate: { icon: "&#128200;", color: "#79c0ff", bg: "#1a2a3a", border: "#1f6feb" },
  Challenge: { icon: "&#9878;", color: "#ff7b72", bg: "#2a1a1a", border: "#da3633" },
  Organize: { icon: "&#128203;", color: "#e3b341", bg: "#2a2a1a", border: "#d29922" },
  Draft: { icon: "&#9999;", color: "#d2a8ff", bg: "#1a1a2a", border: "#a371f7" },
  Polish: { icon: "&#10024;", color: "#7ee787", bg: "#1a2a1a", border: "#3fb950" },
  Archive: { icon: "&#128451;", color: "#8b949e", bg: "#1a1a1a", border: "#484f58" }
};

function getStageFiles(stage) {
  return FILES.filter(f => f.stage === stage);
}

function getTagClass(tag) {
  const clean = tag.replace(/^#/, 'tag-').replace(/[^a-zA-Z0-9-]/g, '-').toLowerCase();
  return 'tag ' + clean;
}

function stageColor(name, count) {
  const meta = STAGE_META[name];
  if (count === 0 && (name === 'Organize' || name === 'Draft' || name === 'Polish')) {
    return { bg: '#1a1a1a', border: '#d29922', text: '#d29922', note: 'BOTTLENECK' };
  }
  return { bg: meta.bg, border: meta.border, text: meta.color, note: '' };
}

// Build pipeline flow
const flowContainer = document.getElementById('pipelineFlow');
STAGES.forEach((name, idx) => {
  const count = STAGE_COUNTS[name];
  const meta = STAGE_META[name];
  const sc = stageColor(name, count);
  const card = document.createElement('div');
  card.className = 'stage-card';
  card.style.borderColor = sc.border;
  card.setAttribute('data-stage', name);
  card.onclick = () => togglePanel(name);
  card.innerHTML = `
    <div class="stage-icon">${meta.icon}</div>
    <div class="stage-name" style="color:${sc.text}">${name}</div>
    <div class="stage-count" style="color:${sc.text}">${count}</div>
    <div class="stage-arrow">${idx < STAGES.length - 1 ? '&#8594;' : ''}</div>
    ${sc.note ? '<div class="bottleneck-badge">&#9888; BOTTLENECK</div>' : ''}
  `;
  flowContainer.appendChild(card);
});

// Build stage panels
const panelsContainer = document.getElementById('stagePanels');
const panels = {};

STAGES.forEach(name => {
  const count = STAGE_COUNTS[name];
  const panel = document.createElement('div');
  panel.className = 'stage-panel';
  panel.id = 'panel-' + name;

  const files = getStageFiles(name);
  const meta = STAGE_META[name];

  let content = `<h2>${meta.icon} ${name} <span class="badge">${count} file${count !== 1 ? 's' : ''}</span></h2>`;

  if (files.length === 0) {
    content += `<div class="empty-state">No items in ${name}</div>`;
  } else {
    files.forEach((f, fi) => {
      const ratingNum = parseInt(f.rating) || 0;
      const ratingClass = ratingNum > 0 ? 'r' + ratingNum : '';
      const tagsHtml = f.tags && f.tags.length > 0
        ? f.tags.map(t => `<span class="${getTagClass(t)}">${t}</span>`).join('')
        : '';

      content += `
        <div class="file-card" data-fileidx="${fi}" data-stage="${name}">
          <div class="file-header" onclick="toggleFileDetails('${name}', ${fi})">
            <div class="file-title">${f.heading || f.filename}</div>
            <div class="file-meta">
              ${f.date ? `<span class="file-date">${f.date}</span>` : ''}
              ${ratingNum > 0 ? `<span class="file-rating ${ratingClass}">${ratingNum}/5</span>` : ''}
            </div>
          </div>
          ${tagsHtml ? `<div class="tags-row">${tagsHtml}</div>` : ''}
          <div class="file-details" id="file-details-${name}-${fi}">
            ${f.source ? `<div class="detail-label">Source</div><div class="detail-value"><a href="${escapeHtml(f.source)}" target="_blank">${escapeHtml(f.source)}</a></div>` : ''}
            ${f.suggested_angle ? `<div class="detail-label">Suggested Angle</div><div class="detail-value">${escapeHtml(f.suggested_angle)}</div>` : ''}
            ${f.body_preview ? `<div class="detail-label">Preview</div><div class="preview-block">${escapeHtml(f.body_preview)}</div>` : ''}
          </div>
        </div>`;
    });
  }

  panel.innerHTML = content;
  panelsContainer.appendChild(panel);
  panels[name] = panel;
});

function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function togglePanel(name) {
  // Toggle visibility
  const panel = panels[name];
  const isVisible = panel.classList.contains('visible');

  // Hide all panels
  Object.values(panels).forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));

  if (!isVisible) {
    panel.classList.add('visible');
    document.querySelector(`.stage-card[data-stage="${name}"]`).classList.add('active');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function toggleFileDetails(stage, idx) {
  const detailId = 'file-details-' + stage + '-' + idx;
  const el = document.getElementById(detailId);
  if (el) {
    el.classList.toggle('visible');
  }
}

</script>
