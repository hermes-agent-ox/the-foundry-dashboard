var STAGE_COLORS = {
    "Capture": "#1f6feb",
    "Incubate": "#238636",
    "Challenge": "#d29922",
    "Organize": "#a371f7",
    "Draft": "#f85149",
    "Polish": "#3fb950",
    "Distribute": "#58a6ff"
};

function escapeHtml(s) {
    if (!s) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function getTagClass(tag) {
    var t = tag.toLowerCase();
    if (t.indexOf("idea") >= 0) return "tag-blue";
    if (t.indexOf("ai-deployment") >= 0 || t.indexOf("deployment") >= 0) return "tag-green";
    if (t.indexOf("applied-ai") >= 0) return "tag-yellow";
    if (t.indexOf("agent") >= 0) return "tag-red";
    if (t.indexOf("enterprise") >= 0 || t.indexOf("ai-") >= 0) return "tag-purple";
    return "tag-default";
}

function getRatingStars(r) {
    var num = parseInt(r) || 0;
    if (num > 5) num = 5;
    return "★".repeat(num) + "☆".repeat(5 - num);
}

function buildPipeline() {
    var el = document.getElementById("pipeline-flow");
    var upstreamHasContent = false;
    
    DATA.forEach(function(stage, i) {
        var isAlert = ALERTS[stage.name] || false;
        var isEmpty = stage.count === 0;
        
        var card = document.createElement("div");
        card.className = "stage-card" + (isAlert ? " stage-alert" : "");
        
        var color = STAGE_COLORS[stage.name] || "#8b949e";
        var html = "<h3 style=\"color:" + color + "\">" + escapeHtml(stage.name) + "</h3>";
        html += "<div class=\"stage-count\">" + stage.count + "</div>";
        if (isAlert) {
            html += "<div class=\"badge-orange\">⚠️ Empty &mdash; upstream has content</div>";
        }
        card.innerHTML = html;
        el.appendChild(card);
        
        if (i < DATA.length - 1) {
            var arrow = document.createElement("div");
            arrow.className = "stage-arrow";
            arrow.textContent = "→";
            el.appendChild(arrow);
        }
        
        if (stage.count > 0) upstreamHasContent = true;
    });
}

function buildDetails() {
    var el = document.getElementById("stage-details");
    
    DATA.forEach(function(stage, idx) {
        var div = document.createElement("div");
        div.className = "stage-detail";
        
        var header = document.createElement("div");
        header.className = "stage-header";
        header.onclick = function() {
            var body = this.nextElementSibling;
            var icon = this.querySelector(".toggle-icon");
            body.classList.toggle("open");
            icon.textContent = body.classList.contains("open") ? "▼" : "▶";
        };
        
        var color = STAGE_COLORS[stage.name] || "#8b949e";
        var stageLabel = stage.name + " (" + stage.count + " file" + (stage.count !== 1 ? "s" : "") + ")";
        header.innerHTML = "<h2><span style=\"color:" + color + "\">■</span> " + escapeHtml(stageLabel) + "</h2><span class=\"toggle-icon\">▶</span>";
        div.appendChild(header);
        
        var body = document.createElement("div");
        body.className = "stage-body";
        
        if (stage.files.length === 0) {
            body.innerHTML = "<div class=\"empty-state\">No files in this stage</div>";
        } else {
            stage.files.forEach(function(file) {
                var card = document.createElement("div");
                card.className = "file-card";
                
                var fh = document.createElement("div");
                fh.className = "file-header";
                fh.onclick = function() {
                    var detail = this.nextElementSibling;
                    detail.classList.toggle("open");
                };
                
                var tagsHtml = "";
                if (file.tags && file.tags.length > 0) {
                    tagsHtml = file.tags.map(function(t) {
                        return "<span class=\"tag " + getTagClass(t) + "\">" + escapeHtml(t) + "</span>";
                    }).join(" ");
                }
                
                var angleHtml = "";
                if (file.suggested_angle) {
                    var preview = file.suggested_angle.length > 120 ? file.suggested_angle.substring(0, 120) + "..." : file.suggested_angle;
                    angleHtml = "<div class=\"angle-preview\">\u201c" + escapeHtml(preview) + "\u201d</div>";
                }
                
                var dateHtml = file.date ? "<span>📅 " + escapeHtml(file.date) + "</span>" : "";
                var ratingHtml = file.rating ? "<span class=\"rating\">" + getRatingStars(file.rating) + "</span>" : "";
                
                fh.innerHTML = "<div><div class=\"file-name\">" + escapeHtml(file.filename) + "</div>" +
                    "<div class=\"file-meta\">" + dateHtml + " " + ratingHtml + " " + tagsHtml + "</div>" +
                    angleHtml + "</div><span class=\"toggle-icon\" style=\"flex-shrink:0\">▶</span>";
                card.appendChild(fh);
                
                var detail = document.createElement("div");
                detail.className = "file-detail";
                
                var fmHtml = "<p><strong>Path:</strong> " + escapeHtml(file.path) + "</p>";
                if (file.frontmatter) {
                    var keys = Object.keys(file.frontmatter);
                    fmHtml += "<div style=\"margin-top:6px\">";
                    keys.forEach(function(k) {
                        var v = file.frontmatter[k];
                        fmHtml += "<strong>" + escapeHtml(k) + ":</strong> ";
                        if (k === "tags" && Array.isArray(v)) {
                            fmHtml += v.map(function(t) { return "<span class=\"tag " + getTagClass(t) + "\">" + escapeHtml(t) + "</span>"; }).join(" ");
                        } else {
                            fmHtml += escapeHtml(String(v).substring(0, 200));
                        }
                        fmHtml += "<br>";
                    });
                    fmHtml += "</div>";
                }
                
                var bodyPreview = "";
                if (file.body_preview) {
                    bodyPreview = "<div style=\"margin-top:8px\"><strong>Body Preview:</strong></div>" +
                        "<pre>" + escapeHtml(file.body_preview.substring(0, 500)) + "</pre>";
                }
                
                detail.innerHTML = fmHtml + bodyPreview;
                card.appendChild(detail);
                body.appendChild(card);
            });
        }
        
        div.appendChild(body);
        el.appendChild(div);
    });
}

function buildTemplates() {
    var el = document.getElementById("templates-list");
    if (!TEMPLATES || TEMPLATES.length === 0) {
        el.innerHTML = "<div class=\"empty-state\">No templates found</div>";
        return;
    }
    TEMPLATES.forEach(function(t) {
        var a = document.createElement("a");
        a.className = "template-link";
        a.textContent = t.filename || "unknown";
        a.title = t.path || "";
        a.onclick = function(e) {
            e.preventDefault();
            var msg = "File: " + t.path + "\n\n";
            if (t.frontmatter) {
                msg += "Frontmatter:\n" + JSON.stringify(t.frontmatter, null, 2);
            }
            if (t.body_preview) {
                msg += "\n\nPreview:\n" + t.body_preview.substring(0, 300);
            }
            alert(msg);
        };
        el.appendChild(a);
    });
}

document.getElementById("update-time").textContent = new Date().toISOString().split("T")[0];
buildPipeline();
buildDetails();
buildTemplates();

</script>
