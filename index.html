function colorForTag(tag) {
  const t = (tag || '').toLowerCase();
  const colors = {
    'idea': 'tag-idea', 'insight': 'tag-insight', 'diamond': 'tag-diamond',
    'bold': 'tag-bold', 'bold-ai': 'tag-bold',
    'ai': 'tag-ai', 'ai-deployment': 'tag-deployment', 'ai-adoption': 'tag-observation',
    'deployment': 'tag-deployment', 'enterprise': 'tag-enterprise', 'enterprise-ai': 'tag-enterprise',
    'retail': 'tag-retail', 'retail-ai': 'tag-retail',
    'observation': 'tag-observation', 'product': 'tag-product',
    'product-leadership': 'tag-product', 'talent': 'tag-observation',
    'applied-ai': 'tag-ai'
  };
  return colors[t] || 'tag-default';
}

function ratingClass(rating) {
  if (rating === '' || rating === null) return 'rating-mid';
  const r = parseFloat(rating);
  if (isNaN(r)) return 'rating-mid';
  if (r >= 4) return 'rating-high';
  if (r >= 2.5) return 'rating-mid';
  return 'rating-low';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderPipeline() {
  const keys = Object.keys(PIPELINE_DATA);
  const totalFiles = keys.reduce((sum, k) => sum + PIPELINE_DATA[k].count, 0);
  
  // Summary
  const stageCounts = keys.map(k => 
    `<span class="pill"><span class="num">${PIPELINE_DATA[k].count}</span> ${PIPELINE_DATA[k].label}</span>`
  ).join('');
  document.getElementById('summary').innerHTML = 
    `<div class="summary-item">Total: <span class="num">${totalFiles}</span> files across <span class="num">${keys.length}</span> stages</div>
     <div class="stage-summary">${stageCounts}</div>`;

  // Pipeline bar cards
  const barHtml = keys.map((key, i) => {
    const s = PIPELINE_DATA[key];
    const isBottleneck = (key === 'challenge' && s.count < 30) || 
                         (key === 'draft' && s.count < 5) ||
                         (key === 'organize' && s.count < 5) ||
                         (key === 'polish' && s.count < 3);
    const arrow = i < keys.length - 1 ? '<div class="stage-arrow">&rarr;</div>' : '';
    return `<div class="stage-card ${isBottleneck ? 'bottleneck' : ''}" onclick="showStage('${key}')">
      <div class="stage-label">${s.label}</div>
      <div class="stage-count">${s.count}</div>
      ${arrow}
    </div>`;
  }).join('');
  document.getElementById('pipelineBar').innerHTML = barHtml;

  // Detail panels
  const panelsHtml = keys.map(key => {
    const s = PIPELINE_DATA[key];
    const filesHtml = s.files.length === 0 
      ? '<p class="no-files">No files in this stage.</p>'
      : s.files.map(f => {
          const tagsHtml = (f.tags || []).map(t => 
            `<span class="tag ${colorForTag(t)}">#${String(t).replace(/^#/, '').trim()}</span>`
          ).join('');
          const rating = (f.rating !== '' && f.rating !== null) ? parseFloat(f.rating) : null;
          const ratingHtml = (rating !== null && !isNaN(rating)) 
            ? `<span class="rating ${ratingClass(rating)}">&#9733; ${rating}</span>` : '';
          const dateStr = f.date ? String(f.date).substring(0, 10) : '';
          const angle = f.suggested_angle || '';
          const source = f.source || '';
          const preview = f.body_preview || '';
          const heading = f.first_heading || f.filename;
          
          return `<div class="file-card" onclick="toggleFile(this)">
            <div class="file-header">
              <div>
                <div class="filename">${esc(heading)}</div>
                <div class="file-meta">
                  ${dateStr ? `<span class="file-date">&#128197; ${dateStr}</span>` : ''}
                  ${ratingHtml}
                  ${f.gauntlet_score ? `<span class="rating rating-high">&#9876; ${esc(f.gauntlet_score)}</span>` : ''}
                </div>
                <div class="file-meta">${tagsHtml}</div>
              </div>
            </div>
            <div class="file-details">
              ${angle ? `<div class="detail-label">Suggested Angle</div><div class="detail-value">${esc(angle)}</div>` : ''}
              ${source ? `<div class="detail-label">Source</div><div class="detail-value"><a href="${esc(source)}" target="_blank">${esc(source)}</a></div>` : ''}
              ${preview ? `<div class="detail-label">Preview</div><div class="detail-value preview">${esc(preview)}</div>` : ''}
            </div>
          </div>`;
        }).join('');
    
    return `<div class="stage-panel" id="panel-${key}">
      <h2>&#128194; ${s.label} <span style="color:#8b949e;font-size:14px;font-weight:400;">(${s.count} files)</span></h2>
      ${filesHtml}
    </div>`;
  }).join('');
  document.getElementById('panels').innerHTML = panelsHtml;

  // Templates
  const tHtml = TEMPLATES.map(t => 
    `<a class="template-badge" href="${esc(t.path)}"><span class="template-label">_TEMPLATE_</span>${esc(t.name)}</a>`
  ).join('');
  document.getElementById('templateList').innerHTML = tHtml || '<p class="no-files">No templates found.</p>';
}

function showStage(key) {
  document.querySelectorAll('.stage-panel').forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
  const panel = document.getElementById('panel-' + key);
  if (panel) {
    panel.classList.add('visible');
    const cards = document.querySelectorAll('.stage-card');
    const keys = Object.keys(PIPELINE_DATA);
    const idx = keys.indexOf(key);
    if (idx >= 0 && cards[idx]) cards[idx].classList.add('active');
  }
}

function toggleFile(el) {
  el.classList.toggle('expanded');
}

function filterFiles(q) {
  const query = q.toLowerCase().trim();
  document.querySelectorAll('.file-card').forEach(card => {
    card.style.display = (!query || card.textContent.toLowerCase().includes(query)) ? '' : 'none';
  });
}

window.addEventListener('DOMContentLoaded', () => {
  renderPipeline();
  const keys = Object.keys(PIPELINE_DATA);
  for (const key of keys) {
    if (PIPELINE_DATA[key].count > 0) {
      showStage(key);
      break;
    }
  }
});
