const TEMPLATES = ["Challenged/_TEMPLATE_Challenge.md", "Drafts/Bridge/_TEMPLATE_Bridge.md", "Drafts/LF/_TEMPLATE_LF.md", "Drafts/SF/_TEMPLATE_SF.md", "Drafts/Thread/_TEMPLATE_Thread.md", "Drafts/Visual/_TEMPLATE_Visual.md"];

const STAGE_ICONS = {
  'inbox': '📥', 'incubating': '🧪', 'challenged': '⚔️',
  'queue': '📋', 'drafts': '✏️', 'polished': '✨', 'archive': '🗃️'
};

const TAG_COLORS = {
  'ai-deployment': 'tag-ai-deployment',
  'enterprise-ai': 'tag-enterprise-ai',
  'retail-ai': 'tag-retail-ai',
  'applied-ai': 'tag-applied-ai',
  'diamond': 'tag-diamond',
  'bold-ai': 'tag-bold-ai',
  'product-leadership': 'tag-product-leadership',
  'framework': 'tag-framework',
  'insight': 'tag-insight',
  'observation': 'tag-observation',
  'org-design': 'tag-org-design',
  'adoption-psychology': 'tag-adoption-psychology',
  'platform-strategy': 'tag-platform-strategy',
  'talent': 'tag-talent',
};

function getTagClass(tag) {
  const normalized = tag.toLowerCase().replace(/[^a-z0-9-]/g, '');
  return TAG_COLORS[normalized] || '';
}

function getRatingClass(rating) {
  const r = parseInt(rating);
  if (r >= 5) return 'rating-5';
  if (r >= 4) return 'rating-4';
  return 'rating-3';
}

function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderPipeline() {
  const bar = document.getElementById('pipelineBar');
  const keys = Object.keys(DATA);
  let html = '';
  keys.forEach((key, i) => {
    const stage = DATA[key];
    html += `<div class="stage-card" onclick="togglePanel('${key}')">
      <div class="stage-icon">${STAGE_ICONS[key] || '📁'}</div>
      <div class="stage-name">${stage.label}</div>
      <div class="stage-count">${stage.count}</div>
      ${i < keys.length - 1 ? '<div class="stage-arrow">→</div>' : ''}
    </div>`;
  });
  bar.innerHTML = html;
}

function togglePanel(key) {
  const panel = document.getElementById('panel-' + key);
  if (!panel) return;
  const isVisible = panel.classList.contains('visible');
  // Close all panels
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
  if (!isVisible) {
    panel.classList.add('visible');
  }
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function renderPanels() {
  const container = document.getElementById('panels');
  let html = '';
  for (const [key, stage] of Object.entries(DATA)) {
    html += `<div class="panel" id="panel-${key}">
      <h2>${STAGE_ICONS[key] || '📁'} ${stage.label} · ${stage.count} file${stage.count !== 1 ? 's' : ''}</h2>
      <div class="file-list">`;

    if (stage.files.length === 0) {
      html += `<div class="empty-state">No files in this stage</div>`;
    }

    stage.files.forEach((file, idx) => {
      const fileId = `detail-${key}-${idx}`;
      const ratingClass = getRatingClass(file.rating);
      html += `<div class="file-row" onclick="toggleDetails('${fileId}')">
        <div class="file-row-header">
          <span class="filename">${escapeHtml(file.filename)}</span>
          ${file.date ? `<span class="date">${file.date}</span>` : ''}
          ${file.rating ? `<span class="rating ${ratingClass}">${file.rating}</span>` : ''}
          ${file.gauntlet_score ? `<span class="gauntlet-badge">${escapeHtml(file.gauntlet_score)}</span>` : ''}
          <span class="tags">${file.tags.map(t => `<span class="tag ${getTagClass(t)}">${escapeHtml(t)}</span>`).join('')}</span>
        </div>
        ${file.suggested_angle ? `<div style="font-size:12px;color:#8b949e;margin-top:4px;padding-left:0;">${escapeHtml(file.suggested_angle).substring(0, 120)}${escapeHtml(file.suggested_angle).length > 120 ? '...' : ''}</div>` : ''}
        <div class="file-details" id="${fileId}">
          ${file.source ? `<div class="detail-row"><div class="detail-label">Source</div><div class="detail-value"><a href="${escapeHtml(file.source)}" target="_blank">${escapeHtml(file.source)}</a></div></div>` : ''}
          ${file.date ? `<div class="detail-row"><div class="detail-label">Date</div><div class="detail-value">${file.date}</div></div>` : ''}
          ${file.challenge_date ? `<div class="detail-row"><div class="detail-label">Challenge Date</div><div class="detail-value">${file.challenge_date}</div></div>` : ''}
          ${file.gauntlet_score ? `<div class="detail-row"><div class="detail-label">Gauntlet Score</div><div class="detail-value">${escapeHtml(file.gauntlet_score)}</div></div>` : ''}
          ${file.tags.length > 0 ? `<div class="detail-row"><div class="detail-label">Tags</div><div class="detail-value"><span class="tags">${file.tags.map(t => `<span class="tag ${getTagClass(t)}">${escapeHtml(t)}</span>`).join('')}</span></div></div>` : ''}
          ${file.rating ? `<div class="detail-row"><div class="detail-label">Rating</div><div class="detail-value">${'★'.repeat(parseInt(file.rating) || 0)}${'☆'.repeat(5 - (parseInt(file.rating) || 0))} (${file.rating}/5)</div></div>` : ''}
          ${file.suggested_angle ? `<div class="detail-row"><div class="detail-label">Suggested Angle</div><div class="detail-value">${escapeHtml(file.suggested_angle)}</div></div>` : ''}
          ${file.body_preview ? `<div class="detail-row"><div class="detail-label">Body Preview (first 500 chars)</div><div class="body-preview">${escapeHtml(file.body_preview)}</div></div>` : ''}
        </div>
      </div>`;
    });

    html += `</div></div>`;
  }
  container.innerHTML = html;
}

function toggleDetails(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('visible');
}

function renderTemplates() {
  const grid = document.getElementById('templatesGrid');
  if (!TEMPLATES || TEMPLATES.length === 0) {
    grid.innerHTML = '<div class="empty-state">No templates found</div>';
    return;
  }
  let html = '';
  TEMPLATES.forEach(t => {
    const displayName = t.split('/').pop() || t;
    html += `<a class="template-link" href="${encodeURI(t)}" target="_blank">📄 ${escapeHtml(displayName)}<br><span style="font-size:10px;color:#484f58;">${escapeHtml(t)}</span></a>`;
  });
  grid.innerHTML = html;
}

document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
renderPipeline();
renderPanels();
renderTemplates();
</script>
