.template-list{display:flex;flex-wrap:wrap;gap:8px}

.template-item span{color:#58a6ff;font-weight:500}
.summary-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.summary-item{font-size:13px;color:#8b949e}
.summary-item strong{color:#f0f6fc}
@media(max-width:768px){.pipeline-bar{flex-direction:column}.stage-card{min-width:unset}.file-grid{grid-template-columns:1fr}}
</style>

var STAGES = ["Capture","Incubate","Challenge","Organize","Draft","Polish"];
var ICONS = {"Capture": "\ud83d\udce5", "Incubate": "\ud83e\udd5a", "Challenge": "\u2694\ufe0f", "Organize": "\ud83d\udccb", "Draft": "\u270d\ufe0f", "Polish": "\u2728"};
var DESCS = {"Capture": "Raw ideas, briefs, and unfiltered signals", "Incubate": "Promising items being developed", "Challenge": "Stress-tested and critiqued", "Organize": "Scheduled and queued for drafting", "Draft": "Long-form, short-form, threads, visuals", "Polish": "Final review, formatting, and publication"};
var MID_STAGES = ["Incubate", "Challenge", "Organize", "Draft"];
var TAG_COLORS = ["#58a6ff","#3fb950","#d29922","#f85149","#bc8cff","#79c0ff","#56d364","#e3b341","#ff7b72","#d2a8ff","#7ee787","#a5d6ff","#ffa657","#ffc680","#c9d1d9"];
function getTagColor(tag){var h=0;for(var i=0;i<tag.length;i++){h=((h<<5)-h)+tag.charCodeAt(i);h=h&h}return TAG_COLORS[Math.abs(h)%TAG_COLORS.length]}
function renderRating(r){if(r===null||r===undefined)return '';var s='';for(var i=0;i<5;i++)s+=i<r?'★':'☆';return '<span class="rating">'+s+'</span>'}
function renderTags(tags){if(!tags||tags.length===0)return '';var out='';for(var i=0;i<tags.length;i++){var t=tags[i];var c=getTagColor(t);out+='<span class="tag" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'44;">#'+t+'</span>'}return out}
function toggleDetail(el){var d=el.querySelector('.file-detail');d.classList.toggle('open')}
function renderFileCard(f){var ang=f.suggested_angle?f.suggested_angle.substring(0,120)+(f.suggested_angle.length>120?'…':''):'';
return '<div class="file-card" onclick="toggleDetail(this)"><div class="file-header"><div class="file-name">'+f.filename+'</div><div class="file-date">'+(f.date||'')+'</div></div><div class="tags">'+renderTags(f.tags)+'</div>'+renderRating(f.rating)+(ang?'<div class="angle">'+ang+'</div>:'')+'<div class="file-detail">'+(f.source?'<div class="detail-label">Source</div><div class="detail-value detail-source"><a href="'+f.source+'" target="_blank">'+f.source+'</a></div>':'')+(f.suggested_angle?'<div class="detail-label">Suggested Angle</div><div class="detail-value">'+f.suggested_angle+'</div>':'')+(f.body_preview?'<div class="detail-label">Body Preview</div><div class="detail-body">'+f.body_preview+'</div>':'')+(f.challenge_date?'<div class="detail-label">Challenge Date</div><div class="detail-value">'+f.challenge_date+'</div>':'')+(f.gauntlet_score?'<div class="detail-label">Gauntlet Score</div><div class="detail-value">'+f.gauntlet_score+'</div>':'')+(f.content_type?'<div class="detail-label">Content Type</div><div class="detail-value">'+f.content_type+'</div>':'')+'</div></div>'}

function init(){var d=new Date();document.getElementById('update-date').textContent='Updated '+d.toISOString().split('T')[0];
var total=0;for(var s=0;s<STAGES.length;s++){total+=DATA.stages[STAGES[s]]?DATA.stages[STAGES[s]].length:0}
document.getElementById('summary-bar').innerHTML='<div class="summary-item">Total files: <strong>'+total+'</strong></div><div class="summary-item">Templates: <strong>'+DATA.templates.length+'</strong></div>';
var bar=document.getElementById('pipeline-bar');
for(var i=0;i<STAGES.length;i++){var s=STAGES[i];var cnt=DATA.stages[s]?DATA.stages[s].length:0;var btl=MID_STAGES.indexOf(s)>=0&&cnt===0;
var cd=document.createElement('div');cd.className='stage-card';cd.id='card-'+s;
cd.innerHTML='<div class="icon">'+ICONS[s]+'</div><div class="stage-name">'+s+'</div><div class="stage-count">'+cnt+'</div><div class="stage-desc">'+DESCS[s]+'</div>'+(btl?'<div class="bottleneck-badge">⚠️ BOTTLENECK</div>':'');
cd.onclick=function(s){return function(){togglePanel(s)}}(s);bar.appendChild(cd)}
var container=document.getElementById('panels-container');
for(var i=0;i<STAGES.length;i++){var s=STAGES[i];var files=DATA.stages[s]||[];
var p=document.createElement('div');p.className='panel';p.id='panel-'+s;
var body='';for(var j=0;j<files.length;j++){body+=renderFileCard(files[j])}
if(files.length===0){body='<div style="color:#8b949e;font-style:italic;grid-column:1/-1;padding:20px;text-align:center;">No files in this stage</div>'}
p.innerHTML='<div class="panel-header" onclick="togglePanel(''+s+'')"><h2>'+ICONS[s]+' '+s+'</h2><span class="count-badge">'+files.length+' files</span></div><div class="panel-body"><div class="file-grid">'+body+'</div></div>';container.appendChild(p)}
if(DATA.templates.length>0){var ts=document.getElementById('templates-section');var tmpl='<h2>📄 Templates</h2><div class="template-list">';
for(var i=0;i<DATA.templates.length;i++){var t=DATA.templates[i];var parts=t.path.split('/');var dir=parts.length>1?parts.slice(0,-1).join('/'):'';tmpl+='<div class="template-item"><span>'+t.filename+'</span>'+(dir?' <span style="color:#8b949e;">&middot; '+dir+'</span>':'')+'</div>'}
tmpl+='</div>';ts.innerHTML=tmpl}}

function togglePanel(s){var p=document.getElementById('panel-'+s);var c=document.getElementById('card-'+s);var isOpen=p.classList.contains('open');
var ps=document.querySelectorAll('.panel');for(var i=0;i<ps.length;i++)ps[i].classList.remove('open')
var cs=document.querySelectorAll('.stage-card');for(var i=0;i<cs.length;i++)cs[i].classList.remove('active')
if(!isOpen){p.classList.add('open');c.classList.add('active');p.scrollIntoView({behavior:'smooth',block:'start'})}}
document.addEventListener('DOMContentLoaded',init);
</script>
