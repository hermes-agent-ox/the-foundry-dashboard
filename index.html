function renderPipeline() {
  const order = ['Capture','Incubate','Challenge','Organize','Draft','Polish','Distribute'];
  const icons = {'Capture':'📥','Incubate':'🔄','Challenge':'⚔️','Organize':'📋','Draft':'✏️','Polish':'✨','Distribute':'🚀'};
  const labels = {'Capture':'Capture','Incubate':'Incubate','Challenge':'Challenge','Organize':'Queue','Draft':'Draft','Polish':'Polish','Distribute':'Distribute'};
  let html = '';
  order.forEach((stage, i) => {
    const count = DATA.stages[stage] || 0;
    html += `<div class="pipeline-step"><div class="label">${icons[stage]} ${labels[stage]}</div><div class="num">${count}</div></div>`;
    if (i < order.length - 1) html += '<div class="pipeline-arrow">→</div>';
  });
  document.getElementById('pipeline-flow').innerHTML = html;
}

function renderStageGrid() {
  const order = ['Inbox','Incubating','Challenged','Queue','Drafts','Polished','Archive'];
  const labels = {'Inbox':'Capture','Incubating':'Incubate','Challenged':'Challenge','Queue':'Organize','Drafts':'Draft','Polished':'Polish','Archive':'Distribute'};
  const stageKey = {'Inbox':'Capture','Incubating':'Incubate','Challenged':'Challenge','Queue':'Organize','Drafts':'Draft','Polished':'Polish','Archive':'Distribute'};
  const colors = {'Capture':'#58a6ff','Incubate':'#d29922','Challenge':'#f85149','Organize':'#3fb950','Draft':'#bc8cff','Polish':'#79c0ff','Distribute':'#7ee787'};
  let html = '';
  order.forEach(dir => {
    const st = stageKey[dir];
    const count = DATA.stages[st] || 0;
    const files = DATA.stage_files[st] || [];
    const top = files.slice(0, 5);
    html += `<div class="stage-card"><h3>${labels[st]} <span style="color:${colors[st]}">●</span></h3><div class="count">${count}</div><div class="sub">`;
    top.forEach(f => html += `<div style="margin:3px 0;font-size:0.75rem">• ${escapeHtml(f.title)}</div>`);
    if (files.length > 5) html += `<div style="margin:3px 0;font-size:0.7rem;color:#484f58">+${files.length-5} more</div>`;
    html += `</div></div>`;
  });
  document.getElementById('stage-grid').innerHTML = html;
}

function renderTagCloud() {
  const tags = Object.keys(DATA.tags).sort();
  let html = tags.map(t => `<span class="tag-item" onclick="filterTag('${escapeHtml(t)}')">${escapeHtml(t)} (${DATA.tags[t].length})</span>`).join('');
  if (!html) html = '<span style="color:#8b949e;font-size:0.85rem">No tags found</span>';
  document.getElementById('tag-cloud').innerHTML = html;
}

let currentFilter = '';

function filterTag(tag) {
  if (currentFilter === tag) { currentFilter = ''; } else { currentFilter = tag; }
  document.querySelectorAll('.tag-item').forEach(el => el.classList.remove('active'));
  if (currentFilter) {
    document.querySelectorAll('.tag-item').forEach(el => {
      if (el.textContent.startsWith(currentFilter+' (')) el.classList.add('active');
    });
  }
  renderFileBrowser();
}

function renderFileBrowser() {
  const search = document.getElementById('search').value.toLowerCase();
  const order = ['Inbox','Incubating','Challenged','Queue','Drafts','Polished','Archive'];
  const labels = {'Inbox':'Capture','Incubating':'Incubate','Challenged':'Challenge','Queue':'Organize','Drafts':'Draft','Polished':'Polish','Archive':'Distribute'};
  const stageKey = {'Inbox':'Capture','Incubating':'Incubate','Challenged':'Challenge','Queue':'Organize','Drafts':'Draft','Polished':'Polish','Archive':'Distribute'};
  let html = '';
  order.forEach(dir => {
    const st = stageKey[dir];
    const files = DATA.stage_files[st] || [];
    let filtered = files.filter(f => {
      if (currentFilter && (!f.tags || !f.tags.includes(currentFilter))) return false;
      if (search) {
        const txt = (f.title + ' ' + f.path + ' ' + (f.tags||[]).join(' ')).toLowerCase();
        return txt.includes(search);
      }
      return true;
    });
    if (filtered.length === 0) return;
    html += `<div class="section-title" style="margin-top:16px">${labels[st]} <span class="stage-count">(${filtered.length})</span></div>`;
    html += '<div class="file-list">';
    filtered.forEach(f => {
      const full = DATA.files[f.path];
      const rating = f.rating || 0;
      const gauntlet = full ? full.gauntlet_score : '';
      const dateStr = f.date ? f.date.substring(0,10) : '';
      const tags = f.tags || [];
      html += `<div class="file-card" onclick="showDetail('${escapeHtml(f.path)}')">`;
      html += `<div class="fname">${escapeHtml(f.title)}</div>`;
      html += `<div class="fmeta">${escapeHtml(f.path)}</div>`;
      html += `<div class="fmeta">`;
      if (dateStr) html += dateStr + ' · ';
      if (rating > 0) html += `<span class="rating-badge">★ ${rating}</span> `;
      if (gauntlet) html += `<span class="gauntlet-badge">⚔ ${escapeHtml(gauntlet)}</span> `;
      html += `</div>`;
      if (tags.length > 0) {
        html += '<div class="ftags">' + tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') + '</div>';
      }
      html += `</div>`;
    });
    html += '</div>';
  });
  if (!html) html = '<div class="no-results">No files match your search or filter.</div>';
  document.getElementById('file-browser').innerHTML = html;
}

function showDetail(path) {
  const f = DATA.files[path];
  if (!f) return;
  document.getElementById('modal-title').textContent = f.title || path;
  let html = '';
  const fields = [
    ['Path', 'path'],
    ['Stage', 'stage'],
    ['Subdirectory', 'subdir'],
    ['Source', 'source'],
    ['Date', 'date'],
    ['Rating', 'rating', v => v > 0 ? '★ ' + v : ''],
    ['Tags', 'tags', v => Array.isArray(v) ? v.join(', ') : v],
    ['Suggested Angle', 'suggested_angle'],
    ['Challenge Date', 'challenge_date'],
    ['Gauntlet Score', 'gauntlet_score'],
    ['Gate Check', 'gate_check'],
    ['Gate Check Reason', 'gate_check_reason'],
    ['Content Type', 'content_type'],
    ['Channel', 'channel'],
    ['Pillar', 'pillar'],
  ];
  fields.forEach(([label, key, fmt]) => {
    let val = f[key];
    if (val === undefined || val === null || val === '' || (Array.isArray(val) && val.length === 0)) return;
    if (fmt) val = fmt(val);
    if (!val) return;
    let vHtml = escapeHtml(String(val));
    if (key === 'source' && typeof val === 'string' && val.startsWith('http')) vHtml = `<a href="${escapeHtml(val)}" target="_blank">${escapeHtml(val)}</a>`;
    html += `<div class="field"><div class="field-label">${label}</div><div class="field-value">${vHtml}</div></div>`;
  });
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.getElementById('search').addEventListener('input', renderFileBrowser);

function renderTemplates() {
  if (!DATA.templates || DATA.templates.length === 0) return;
  let html = '<h3>📄 Templates (' + DATA.templates.length + ')</h3><div class="template-grid">';
  DATA.templates.forEach(t => {
    html += '<div class="template-item">' + escapeHtml(t.title) + '</div>';
  });
  html += '</div>';
  document.getElementById('template-section').innerHTML = html;
}

document.getElementById('gen-date').textContent = DATA.generated;
document.getElementById('file-count').textContent = DATA.total_main;
renderStats();
renderPipeline();
renderStageGrid();
renderTagCloud();
renderFileBrowser();
renderTemplates();
</script>
</body>
</html>
