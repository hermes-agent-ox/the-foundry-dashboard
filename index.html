var STAGES = ["capture","incubate","challenge","organize","draft","polish","archive"];
var LABELS = {"capture": "Capture", "incubate": "Incubate", "challenge": "Challenge", "organize": "Organize", "draft": "Draft", "polish": "Polish", "archive": "Archive"};
var ICONS = {"capture": "\ud83d\udce5", "incubate": "\ud83d\udd04", "challenge": "\u2694\ufe0f", "organize": "\ud83d\udccb", "draft": "\u270d\ufe0f", "polish": "\u2728", "archive": "\ud83d\uddc4\ufe0f"};
var COLORS = {"capture": "#58a6ff", "incubate": "#d29922", "challenge": "#f85149", "organize": "#3fb950", "draft": "#bc8cff", "polish": "#79c0ff", "archive": "#8b949e"};

function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;").replace(/"/g,"&quot;")}
function tagsHtml(t){if(!t||!t.length)return"";return t.map(function(x){return'<span class="tag">'+esc(x)+'</span>'}).join(" ")}

function buildPipeline(){
  var bar=document.getElementById("pipelineBar");
  STAGES.forEach(function(key){
    var s=DATA.stages[key];if(!s)return;
    var c=s.count>0?COLORS[key]:"#484f58";
    var bottle=false;
    if(key==="incubate"&&(DATA.meta.stage_counts.capture||0)>0&&s.count===0)bottle=true;
    if(key==="challenge"&&(DATA.meta.stage_counts.incubate||0)>0&&s.count===0)bottle=true;
    var card=document.createElement("div");
    card.className="stage-card"+(bottle?" bottleneck":"");
    card.dataset.stage=key;
    card.innerHTML='<div class="stage-icon">'+ICONS[key]+'</div><div class="stage-name">'+LABELS[key]+'</div><div class="stage-count '+(s.count===0?"zero":"")+'" style="color:'+c+'">'+s.count+'</div><div style="font-size:10px;color:#8b949e;margin-top:2px">'+esc(s.dir)+'</div>'+(bottle?'<div class="bottleneck-badge">&#x26a0; BOTTLENECK</div>':'');
    card.addEventListener("click",function(){toggleStage(key)});
    bar.appendChild(card);
  });
  document.getElementById("totalCount").textContent=DATA.meta.total_files;
}

function buildPanels(){
  var container=document.getElementById("stagePanels");
  STAGES.forEach(function(key){
    var s=DATA.stages[key];if(!s)return;
    var panel=document.createElement("div");panel.className="stage-panel";panel.id="panel-"+key;
    var body="";
    if(s.count===0){
      body='<div style="padding:20px;text-align:center;color:#484f58;font-size:13px">No files in this stage</div>';
    }else{
      s.files.forEach(function(f){
        var tags=tagsHtml(f.tags);
        var extraRows="";
        if(f.extra){
          Object.keys(f.extra).forEach(function(k){extraRows+='<tr><td>'+esc(k)+'</td><td>'+esc(f.extra[k])+'</td></tr>'});
        }
        var extraFields="";
        if(f.challenge_date)extraFields+='<tr><td>Challenge Date</td><td>'+esc(f.challenge_date)+'</td></tr>';
        if(f.gauntlet_score)extraFields+='<tr><td>Gauntlet Score</td><td>'+esc(f.gauntlet_score)+'</td></tr>';
        if(f.gate_check)extraFields+='<tr><td>Gate Check</td><td>'+esc(f.gate_check)+'</td></tr>';
        if(f.gate_check_reason)extraFields+='<tr><td>Gate Reason</td><td>'+esc(f.gate_check_reason)+'</td></tr>';
        if(f.content_type)extraFields+='<tr><td>Content Type</td><td>'+esc(f.content_type)+'</td></tr>';
        if(f.draft_type)extraFields+='<tr><td>Draft Type</td><td>'+esc(f.draft_type)+'</td></tr>';
        var ratingHtml=f.rating?'<span class="file-rating">'+esc(f.rating)+'</span>':"";
        var dateHtml=f.date?'<span class="file-date">'+esc(f.date)+'</span>':"";
        body+='<div class="file-card"><div class="file-header" onclick="toggleFile(this)"><span class="file-name">'+esc(f.filename)+'</span>'+(tags?'<span class="file-tags">'+tags+'</span>':'')+dateHtml+ratingHtml+'</div><div class="file-detail"><table>'+(f.source?'<tr><td>Source</td><td>'+esc(f.source)+'</td></tr>':'')+(f.date?'<tr><td>Date</td><td>'+esc(f.date)+'</td></tr>':'')+(f.suggested_angle?'<tr><td>Angle</td><td>'+esc(f.suggested_angle)+'</td></tr>':'')+(f.rating?'<tr><td>Rating</td><td>'+esc(f.rating)+'</td></tr>':'')+'<tr><td>Path</td><td>'+esc(f.path)+'</td></tr>'+extraFields+extraRows+'</table>'+(tags?'<div style="margin-bottom:6px">'+tags+'</div>':'')+(f.body_preview?'<div class="preview">'+esc(f.body_preview)+'</div>':'')+'</div></div>';
      });
    }
    panel.innerHTML='<div class="panel-header" onclick="toggleStage(\''+key+'\')"><span class="panel-title">'+ICONS[key]+' '+LABELS[key]+' <span style="font-weight:400;color:#8b949e;font-size:12px">('+esc(s.dir)+')</span></span><span class="panel-count">'+s.count+' file'+(s.count!==1?"s":"")+'</span></div><div class="panel-body">'+body+'</div>';
    container.appendChild(panel);
  });
}

function buildTemplates(){
  var grid=document.getElementById("templateGrid");
  if(!DATA.templates)return;
  DATA.templates.forEach(function(t){
    var card=document.createElement("div");card.className="template-card";
    card.onclick=function(){this.classList.toggle("open");};
    card.innerHTML='<div class="template-name">&#x1f4c4; '+esc(t.name)+'</div><div style="font-size:10px;color:#484f58;margin-top:2px">'+esc(t.path)+'</div><div class="preview">'+esc(t.body_preview)+'</div>';
    grid.appendChild(card);
  });
}

var activeStage=null;
function toggleStage(key){
  var panel=document.getElementById("panel-"+key);
  var card=document.querySelector('.stage-card[data-stage="'+key+'"]');
  if(activeStage===key){
    panel.classList.toggle("open");card.classList.toggle("active");
    if(!panel.classList.contains("open"))activeStage=null;
  }else{
    if(activeStage){
      var op=document.getElementById("panel-"+activeStage);var oc=document.querySelector('.stage-card[data-stage="'+activeStage+'"]');
      if(op)op.classList.remove("open");if(oc)oc.classList.remove("active");
    }
    panel.classList.add("open");card.classList.add("active");activeStage=key;
    panel.scrollIntoView({behavior:"smooth",block:"start"});
  }
}
function toggleFile(h){h.nextElementSibling.classList.toggle("open");}

buildPipeline();buildPanels();buildTemplates();
</script>
