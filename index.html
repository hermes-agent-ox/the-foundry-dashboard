          var cd = document.createElement('div');
          cd.className = 'field';
          cd.innerHTML = '<div class="field-label">Challenge Date</div><div class="field-value">' + file.challenge_date + '</div>';
          body.appendChild(cd);
        }
        
        if (file.gate_check) {
          var gc = document.createElement('div');
          gc.className = 'field';
          gc.innerHTML = '<div class="field-label">Gate Check</div><div class="field-value">' + file.gate_check + (file.gate_check_reason ? '<br><span style="color:#8b949e;font-size:0.78rem;">' + file.gate_check_reason + '</span>' : '') + '</div>';
          body.appendChild(gc);
        }
        
        if (file.format) {
          var fmt = document.createElement('div');
          fmt.className = 'field';
          fmt.innerHTML = '<div class="field-label">Format</div><div class="field-value">' + file.format + '</div>';
          body.appendChild(fmt);
        }
        
        if (file.pillar) {
          var pl = document.createElement('div');
          pl.className = 'field';
          pl.innerHTML = '<div class="field-label">Pillar</div><div class="field-value">' + file.pillar + '</div>';
          body.appendChild(pl);
        }
        
        if (file.preview) {
          var pr = document.createElement('div');
          pr.className = 'field';
          var headingText = file.heading ? file.heading : '';
          pr.innerHTML = '<div class="field-label">Preview' + (headingText ? ' — ' + headingText : '') + '</div>';
          var pv = document.createElement('div');
          pv.className = 'preview-text';
          pv.textContent = file.preview.replace(/<[^>]*>/g, '');
          pr.appendChild(pv);
          body.appendChild(pr);
        }
        
        card.appendChild(body);
        panel.appendChild(card);
      });
    }
    
    details.appendChild(panel);
  });

  // Templates
  var tg = document.getElementById('templates-grid');
  if (d.templates && d.templates.length > 0) {
    d.templates.forEach(function(t) {
      var a = document.createElement('a');
      a.className = 'template-link';
      a.href = t.path;
      a.textContent = t.filename;
      a.title = t.heading || t.filename;
      tg.appendChild(a);
    });
  } else {
    tg.innerHTML = '<div class="empty-state">No templates found.</div>';
  }

  // Helper functions
  var activeStage = null;
  function toggleStage(id) {
    var panels = document.querySelectorAll('.stage-detail');
    var cards = document.querySelectorAll('.stage-card');
    if (activeStage === id) {
      activeStage = null;
      panels.forEach(function(p) { p.classList.remove('visible'); });
      cards.forEach(function(c) { c.classList.remove('active'); });
    } else {
      activeStage = id;
      panels.forEach(function(p) { 
        p.classList.remove('visible');
        if (p.id === 'detail-' + id) p.classList.add('visible');
      });
      cards.forEach(function(c) {
        c.classList.remove('active');
        if (c.dataset.stage === id) c.classList.add('active');
      });
    }
  }

  function toggleFileBody(card) {
    var body = card.querySelector('.file-body');
    if (body) body.classList.toggle('open');
  }

  // Auto-open first non-empty stage
  for (var i = 0; i < d.stages.length; i++) {
    if (d.stages[i].count > 0) {
      toggleStage(d.stages[i].id);
      break;
    }
  }
})();
</script>
</body>
</html>
