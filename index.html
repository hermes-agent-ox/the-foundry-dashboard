const STAGE_ORDER = ["capture","incubate","challenge","organize","draft","polish","distribute"];
const STAGE_LABELS = {
  capture: "Capture", incubate: "Incubate", challenge: "Challenge",
  organize: "Organize", draft: "Draft", polish: "Polish", distribute: "Distribute"
};
const STAGE_ICONS = {
  capture: "📥", incubate: "🥚", challenge: "⚡",
  organize: "📋", draft: "✏️", polish: "✨", distribute: "🚀"
};

function countStage(name) {
  return (DATA[name] || []).length;
}

function isBottleneck(idx, counts) {
  if (idx <= 0 || idx >= counts.length - 1) return false;
  // Mid-pipeline stages: incubate(1), challenge(2), organize(3), draft(4)
  // Empty mid-pipeline stages are bottlenecks
  return counts[idx] === 0;
}

function renderPipeline() {
  const bar = document.getElementById('pipelineBar');
  const counts = STAGE_ORDER.map(s => countStage(s));
  
  bar.innerHTML = STAGE_ORDER.map((s, i) => {
    const cnt = counts[i];
    const bottle = isBottleneck(i, counts);
    return `<div class="stage-card ${bottle ? 'bottleneck' : ''}" data-stage="${s}" onclick="showStage('${s}')">
      <div class="stage-name">${STAGE_ICONS[s]} ${STAGE_LABELS[s]}${bottle ? '<span class="bottleneck-badge">⚠️</span>' : ''}</div>
      <div class="stage-count">${cnt}${bottle ? ' <span style="font-size:14px;color:#d29922;">empty</span>' : ''}</div>
    </div>`;
  }).join('');

  document.getElementById('summaryLine').textContent = 
    `${counts.reduce((a,b) => a+b, 0)} total items across ${STAGE_ORDER.length} stages`;
}

function renderStagePanel(stageName, files) {
  if (!files || files.length === 0) {
    return `<div class="detail-panel" id="panel-${stageName}">
      <h2 style="margin-bottom:8px;">${STAGE_ICONS[stageName]} ${STAGE_LABELS[stageName]} <span style="font-size:14px;color:#8b949e;">(0 files)</span></h2>
      <p style="color:#8b949e;font-size:14px;">No files in this stage.</p>
    </div>`;
  }

  const cards = files.map((f, fi) => {
    let tagsHtml = '';
    if (f.tags && f.tags.length > 0) {
      tagsHtml = '<div class="tags">' + f.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') + '</div>';
    }
    if (f.rating) {
      const rClass = f.rating >= 4 ? 'rating-high' : 'rating';
      tagsHtml += `<span class="tag ${rClass}">★ ${f.rating}</span>`;
    }
    if (f.gate_check) {
      const gc = f.gate_check.toLowerCase();
      let gcClass = 'gate-pending';
      if (gc === 'pass') gcClass = 'gate-pass';
      else if (gc === 'fail') gcClass = 'gate-fail';
      tagsHtml += `<span class="tag ${gcClass}">gate: ${f.gate_check}</span>`;
    }
    if (f.gauntlet_score) {
      tagsHtml += `<span class="tag" style="background:#1a3a2a;color:#3fb950;">gauntlet: ${escapeHtml(f.gauntlet_score)}</span>`;
    }

    const angle = f.suggested_angle ? escapeHtml(f.suggested_angle) : '';
    const preview = f.body_preview ? escapeHtml(f.body_preview) : '';
    const sourceUrl = f.source ? escapeHtml(f.source) : '';
    const dateStr = f.date ? f.date : '';
    const chDate = f.challenge_date ? `challenge: ${f.challenge_date}` : '';

    return `<div class="file-card">
      <h3>${escapeHtml(f.filename)}</h3>
      <div class="meta">
        ${dateStr ? `<strong>Date:</strong> ${dateStr}` : ''}
        ${chDate ? ` | <strong>${chDate}</strong>` : ''}
        ${sourceUrl ? `<br><strong>Source:</strong> <a href="${sourceUrl}" target="_blank" style="color:#58a6ff;word-break:break-all;">${sourceUrl}</a>` : ''}
      </div>
      ${tagsHtml}
      ${angle ? `<button class="expand-btn" onclick="toggleAngle('${stageName}-${fi}')">Show Angle</button>
      <div class="full-angle" id="angle-${stageName}-${fi}">${angle}</div>` : ''}
      ${preview ? `<div class="preview" id="preview-${stageName}-${fi}">${preview}</div>` : ''}
    </div>`;
  }).join('');

  return `<div class="detail-panel visible" id="panel-${stageName}">
    <h2 style="margin-bottom:12px;">${STAGE_ICONS[stageName]} ${STAGE_LABELS[stageName]} <span style="font-size:14px;color:#8b949e;">(${files.length} files)</span></h2>
    <div class="file-grid">${cards}</div>
  </div>`;
}

function renderAllPanels() {
  const container = document.getElementById('detailPanels');
  container.innerHTML = STAGE_ORDER.map(s => renderStagePanel(s, DATA[s] || [])).join('');
}

function showStage(stage) {
  const panels = document.querySelectorAll('.detail-panel');
  panels.forEach(p => p.classList.remove('visible'));
  const target = document.getElementById('panel-' + stage);
  if (target) {
    target.classList.add('visible');
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.querySelectorAll('.stage-card').forEach(c => c.classList.remove('active'));
  document.querySelector(`.stage-card[data-stage="${stage}"]`)?.classList.add('active');
}

function toggleAngle(id) {
  const el = document.getElementById('angle-' + id);
  if (el) {
    el.classList.toggle('visible');
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// Templates
const TEMPLATES = [
  { name: "Challenge", path: "Challenged/_TEMPLATE_Challenge.md" },
  { name: "Long Form (LF)", path: "Drafts/LF/_TEMPLATE_LF.md" },
  { name: "Short Form (SF)", path: "Drafts/SF/_TEMPLATE_SF.md" },
  { name: "Thread", path: "Drafts/Thread/_TEMPLATE_Thread.md" },
  { name: "Bridge", path: "Drafts/Bridge/_TEMPLATE_Bridge.md" },
  { name: "Visual", path: "Drafts/Visual/_TEMPLATE_Visual.md" },
];

function renderTemplates() {
  const list = document.getElementById('templateList');
  list.innerHTML = TEMPLATES.map(t => 
    `<a class="template-link" href="${t.path}" target="_blank">${t.name}</a>`
  ).join('');
}

renderPipeline();
renderAllPanels();
renderTemplates();

// Show first non-empty stage by default
for (const s of STAGE_ORDER) {
  if (DATA[s] && DATA[s].length > 0) {
    showStage(s);
    break;
  }
}

})();
